name: Painel Bíblico APK

on:
  push:
    branches: [ main ]
    paths: [ 'painel/**', '.github/workflows/painel.yml' ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-painel
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copiar a app web para dentro do APK
        run: |
          mkdir -p painel/android/app/src/main/assets
          cp -r painel/web/* painel/android/app/src/main/assets/

      - name: Construir APK
        working-directory: painel/android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: epfxg1btY6reZelhaR6nPRh7
          KEY_PASSWORD: epfxg1btY6reZelhaR6nPRh7
          KEY_ALIAS: ementa
        run: gradle assembleRelease --no-daemon

      - name: Dar nome ao ficheiro
        run: cp painel/android/app/build/outputs/apk/release/app-release.apk "PainelBiblico-1.${{ github.run_number }}.apk"

      - name: Publicar na pagina de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: painel-1.${{ github.run_number }}
          name: Painel Bíblico 1.${{ github.run_number }}
          make_latest: false
          body: |
            Para instalar no Android: descarregue o ficheiro .apk abaixo, abra-o e aceite "Instalar".
            Se o telemovel pedir, autorize a instalacao de aplicacoes desta origem.
          files: PainelBiblico-1.${{ github.run_number }}.apk

