<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<title>Futsal em Equipa</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Futsal">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="html2canvas.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<style>
:root{
  --navy:#0b1f3a;--navy2:#13315c;--laranja:#f97316;--cor:#f97316;
  --fundo:#f3f5f8;--cartao:#fff;--texto:#0f172a;--suave:#64748b;--linha:#e2e8f0;
  --ok:#16a34a;--ok-c:#dcfce7;--mau:#dc2626;--mau-c:#fee2e2;--aviso:#d97706;--aviso-c:#fef3c7;--info-c:#e0ecff;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--fundo);color:var(--texto);font-size:15px;line-height:1.45;padding-bottom:calc(74px + var(--sb))}
.cond{font-family:"Barlow Condensed","Arial Narrow",Inter,sans-serif;letter-spacing:.3px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Inter,sans-serif;font-weight:700;letter-spacing:.3px}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:calc(12px + var(--st)) 14px 12px;position:sticky;top:0;z-index:15;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.hwrap{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px}
.hwrap .app{width:34px;height:34px;border-radius:9px}
.eqbtn{flex:1;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:6px 10px;font-family:inherit;text-align:left;cursor:pointer;min-width:0}
.eqbtn img{width:30px;height:30px;border-radius:50%;background:#fff;object-fit:cover;flex:none}
.eqbtn .t{min-width:0}.eqbtn small{display:block;font-size:10.5px;opacity:.7;text-transform:uppercase;letter-spacing:.6px}
.eqbtn b{display:block;font-size:17px;font-family:"Barlow Condensed",Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eubtn{background:var(--cor);color:#fff;border:0;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:600;font-family:inherit;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
main{max-width:900px;margin:0 auto;padding:14px}
.sec{display:none}.sec.on{display:block}
.titulo{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px;gap:8px}
.titulo h2{font-size:24px;text-transform:uppercase}
.sub{font-size:13px;color:var(--suave);margin:-8px 0 12px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-family:inherit;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.cor{background:var(--cor)}
.btn.claro{background:#e8edf5;color:var(--navy)}
.btn.verde{background:var(--ok)}.btn.wa{background:#1f9d55}
.btn.perigo{background:var(--mau-c);color:var(--mau)}
.btn.mini{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.largo{width:100%;padding:13px;font-size:15px;margin-bottom:8px}
.btn:disabled{opacity:.45}
.card{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:14px;margin-bottom:10px}
.card.click{cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:12px;border-top:4px solid var(--cor)}
.kpi b{display:block;font-size:28px;font-family:"Barlow Condensed",Inter,sans-serif;line-height:1.1;word-break:break-word}
.kpi span{font-size:12px;color:var(--suave)}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:16px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:18px solid var(--cor);opacity:.35}
.hero .rot{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.75}
.hero h3{font-size:24px;margin:2px 0 4px}
.hero .meta{color:#cbd5e1}
.linha{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.meta{font-size:12.5px;color:var(--suave)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:#e8edf5;color:var(--navy);margin:3px 4px 0 0;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-c);color:var(--ok)}.tag.mau{background:var(--mau-c);color:var(--mau)}.tag.am{background:var(--aviso-c);color:var(--aviso)}.tag.cor{background:var(--cor);color:#fff}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--linha);border-radius:10px;font-family:inherit;font-size:16px;background:#fff;margin-top:4px;color:var(--texto)}
label{display:block;font-size:13px;font-weight:600;margin-bottom:10px}
label.chk{display:flex;gap:10px;align-items:center;font-weight:500;font-size:14px}
label.chk input{width:20px;height:20px;margin:0;flex:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.busca{margin-bottom:10px}
.vazio{text-align:center;color:var(--suave);padding:24px 10px;font-size:14px}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1px solid var(--linha);background:#fff;border-radius:20px;padding:7px 13px;font-family:inherit;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--texto);font-weight:500}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.av{width:42px;height:42px;border-radius:50%;flex:none;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;background:var(--navy2)}
.av.p{width:34px;height:34px;font-size:12.5px}
.jrow{display:flex;gap:10px;align-items:center}
.jrow .info{flex:1;min-width:0}
.jrow .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.estrelas{color:#f59e0b;font-size:12px;letter-spacing:1px}
.num{font-family:"Barlow Condensed",Inter,sans-serif;font-weight:700;font-size:15px;color:var(--suave);min-width:24px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:8px 6px;border-bottom:1px solid var(--linha);text-align:left;vertical-align:top}
th{font-size:11.5px;color:var(--suave);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
td.n,th.n{text-align:right;white-space:nowrap}
.rec{color:var(--ok)}.desp{color:var(--mau)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--linha);display:flex;overflow-x:auto;z-index:20;padding-bottom:var(--sb);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1;min-width:62px;background:none;border:0;padding:8px 2px 9px;font-family:inherit;font-size:10.5px;color:var(--suave);cursor:pointer;font-weight:500}
nav button .ic{display:block;font-size:19px;margin-bottom:1px}
nav button.on{color:var(--navy);font-weight:700;box-shadow:inset 0 3px 0 var(--cor)}
.camada{position:fixed;inset:0;background:rgba(8,15,30,.5);display:none;align-items:flex-end;justify-content:center}
.camada.on{display:flex}
#folha{z-index:35}#modal{z-index:45}
.caixa{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + var(--sb))}
#folha .caixa{max-height:96vh;background:var(--fundo)}
@media(min-width:700px){.camada{align-items:center}.caixa{border-radius:18px}}
.caixa h3{font-size:22px;margin-bottom:12px}
.fcab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;position:sticky;top:-16px;background:inherit;padding:6px 0;z-index:2}
.fcab h3{margin:0}
.fechar{background:#e8edf5;border:0;border-radius:50%;width:34px;height:34px;font-size:17px;cursor:pointer;flex:none}
.bloco{margin-bottom:14px}
.bloco>h4{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--suave);margin:0 0 8px;font-weight:700}
.estado{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.estado button{border:1px solid var(--linha);background:#fff;border-radius:16px;padding:4px 9px;font-size:12px;font-family:inherit;cursor:pointer;color:var(--texto)}
.estado button.on.conf,.estado button.on.pres{background:var(--ok);color:#fff;border-color:var(--ok)}
.estado button.on.just{background:var(--aviso);color:#fff;border-color:var(--aviso)}
.estado button.on.injust{background:var(--mau);color:#fff;border-color:var(--mau)}
.estado button.on.nconf{background:#94a3b8;color:#fff;border-color:#94a3b8}
.grupos{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.grupos{grid-template-columns:1fr 1fr}}
.grupo{border-radius:12px;border:2px solid var(--linha);background:#fff;padding:10px}
.grupo h5{font-family:"Barlow Condensed",Inter,sans-serif;font-size:18px;display:flex;justify-content:space-between}
.mover{display:flex;gap:3px}
.mover button{border:0;border-radius:6px;width:24px;height:24px;font-size:11px;font-weight:700;color:#fff;cursor:pointer}
.placar{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}
.placar .lado{text-align:center;flex:1}
.placar .lado b{display:block;font-family:"Barlow Condensed",Inter,sans-serif;font-size:15px}
.placar .res{font-family:"Barlow Condensed",Inter,sans-serif;font-size:40px;font-weight:700}
.placar input{width:64px;text-align:center;font-size:26px;font-weight:700;padding:6px}
.vde{display:inline-block;width:22px;height:22px;border-radius:6px;color:#fff;font-weight:700;font-size:12px;text-align:center;line-height:22px;margin-right:3px}
.vde.V{background:var(--ok)}.vde.E{background:#94a3b8}.vde.D{background:var(--mau)}
.prev{background:#cbd5e1;border-radius:10px;padding:8px;overflow:hidden}
.prev .doc{box-shadow:0 2px 12px rgba(0,0,0,.2)}
#render{position:fixed;left:-12000px;top:0;width:794px}
.toast{position:fixed;bottom:calc(84px + var(--sb));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90%;text-align:center}
.toast.on{opacity:1}
.aviso-box{background:var(--aviso-c);border-left:4px solid var(--aviso);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
.imgprev{max-width:120px;max-height:120px;border-radius:10px;display:block;margin-top:6px;border:1px solid var(--linha)}
.ldr{position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:70;display:none;align-items:center;justify-content:center;font-weight:600;color:var(--navy)}
.ldr.on{display:flex}

/* ---------- documento dos relatórios (A4) ---------- */
.doc{width:794px;background:#fff;color:#0f172a;font-family:Inter,Arial,sans-serif;font-size:12.5px;padding:34px 38px 30px}
.doc .dcab{display:flex;align-items:center;gap:16px;border-bottom:4px solid var(--dcor,#f97316);padding-bottom:14px;margin-bottom:16px}
.doc .dcab img{width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid #e2e8f0}
.doc .dcab .eq{font-size:13px;color:#64748b;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.doc .dcab h1{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:30px;line-height:1.05;color:#0b1f3a;text-transform:uppercase}
.doc .dcab .per{font-size:12px;color:#64748b;margin-top:2px}
.doc .dcab .app{margin-left:auto;text-align:right;font-size:10px;color:#94a3b8}
.doc .dcab .app img{width:38px;height:38px;border-radius:9px;border:0;display:block;margin:0 0 3px auto}
.doc h2{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:19px;color:#0b1f3a;text-transform:uppercase;margin:16px 0 8px;border-left:5px solid var(--dcor,#f97316);padding-left:8px}
.doc table{font-size:12px}
.doc th{background:#0b1f3a;color:#fff;font-size:10.5px;padding:7px 6px;border:0}
.doc td{padding:6px;border-bottom:1px solid #e2e8f0}
.doc tr:nth-child(even) td{background:#f8fafc}
.doc tfoot td{font-weight:700;background:#eef2f7!important;border-top:2px solid #0b1f3a}
.doc .dk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}
.doc .dk div{border:1px solid #e2e8f0;border-top:4px solid var(--dcor,#f97316);border-radius:8px;padding:8px}
.doc .dk b{display:block;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:24px;color:#0b1f3a}
.doc .dk span{font-size:10.5px;color:#64748b}
.doc .drod{margin-top:22px;border-top:1px solid #e2e8f0;padding-top:8px;font-size:10px;color:#94a3b8;display:flex;justify-content:space-between}
.doc .ass{display:flex;justify-content:space-around;margin-top:44px;text-align:center;font-size:11px;color:#475569}
.doc .ass div{border-top:1px solid #475569;padding-top:4px;width:200px}
.doc .av{all:unset;color:#d97706;font-weight:700}
.doc .ok{color:#16a34a;font-weight:700}.doc .mau{color:#dc2626;font-weight:700}.doc .av{color:#d97706;font-weight:700}
.doc .mx td,.doc .mx th{text-align:center;padding:5px 3px}
.doc .mx td:first-child,.doc .mx th:first-child{text-align:left}
.doc .gr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.doc .gr>div{border:2px solid #e2e8f0;border-radius:10px;padding:10px}
.doc .nota{font-size:11px;color:#64748b;margin-top:6px}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <img class="app" src="icon-192.png" alt="">
    <button class="eqbtn" onclick="escolherEquipa()"><img id="h-logo" alt=""><span class="t"><small>Equipa actual</small><b id="h-eq">·</b></span><span style="margin-left:auto;opacity:.7">▾</span></button>
    <button class="eubtn" id="h-eu" onclick="escolherEu()"></button>
  </div>
</header>

<main>
  <section class="sec on" id="s-painel"></section>
  <section class="sec" id="s-jogadores"></section>
  <section class="sec" id="s-agenda"></section>
  <section class="sec" id="s-jogos"></section>
  <section class="sec" id="s-tesouraria"></section>
  <section class="sec" id="s-relatorios"></section>
  <section class="sec" id="s-gestao"></section>
</main>

<nav id="nav"></nav>
<div class="camada" id="folha"><div class="caixa" id="folha-c"></div></div>
<div class="camada" id="modal"><div class="caixa" id="modal-c"></div></div>
<div id="render"></div>
<div class="toast" id="toast"></div>
<div class="ldr" id="ldr">A preparar o ficheiro…</div>

<script>
/* =========================================================
   UTILITÁRIOS
   ========================================================= */
const el=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kz=v=>new Intl.NumberFormat('pt-PT',{maximumFractionDigits:0}).format(v||0)+' Kz';
const nf=v=>new Intl.NumberFormat('pt-PT',{maximumFractionDigits:0}).format(v||0);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const hoje=()=>iso(new Date());
const addDias=(n,base)=>{const d=base?new Date(base+'T12:00'):new Date();d.setDate(d.getDate()+n);return iso(d)};
const dataPt=s=>{if(!s)return'';const[a,m,d]=s.split('-');return `${d}/${m}/${a}`};
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const dataLonga=s=>{const d=new Date(s+'T12:00');return `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`};
const diasAte=s=>Math.round((new Date(s+'T12:00')-new Date(hoje()+'T12:00'))/864e5);
const ANDROID=!!window.AndroidBridge;
const pct=(a,b)=>b?Math.round(a/b*100):0;
function toast(t){const e=el('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
function copiarAntigo(t){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok}
function copiar(t,msg){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast(msg),()=>toast(copiarAntigo(t)?msg:'Não foi possível copiar'));else toast(copiarAntigo(t)?msg:'Não foi possível copiar')}
function telIntl(t){let d=String(t||'').replace(/\D/g,'');if(d.length===9&&d[0]==='9')d='244'+d;return d}
function whatsapp(texto,tel){const url='https://wa.me/'+(tel?telIntl(tel):'')+'?text='+encodeURIComponent(texto);if(ANDROID)location.href=url;else window.open(url,'_blank')}
function b64utf8(t){return btoa(unescape(encodeURIComponent(t)))}
function salvarB64(nome,b64,mime){
  if(ANDROID){window.AndroidBridge.save(nome,b64,mime);return}
  const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:mime}));a.download=nome;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Ficheiro guardado: '+nome);
}
function nomeFich(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'-').replace(/^-|-$/g,'').toLowerCase()}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function baralhar(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function comprimirImg(file,max,mime='image/jpeg',q=.7){
  return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    const x=c.getContext('2d');if(mime==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL(mime,q))};im.onerror=ko;im.src=r.result};r.onerror=ko;r.readAsDataURL(file)});
}

/* =========================================================
   DADOS
   ========================================================= */
const CHAVE='futsal-em-equipa-v1';
const POS=['Guarda-redes','Fixo','Ala','Pivô','Universal'];
const POS_C={'Guarda-redes':'GR','Fixo':'FX','Ala':'AL','Pivô':'PV','Universal':'UN'};
const FUNC={admin:'Administrador',coord:'Coordenador',tes:'Tesoureiro',trein:'Treinador',jog:'Jogador'};
const TIPOS_EQ=['Família','Igreja','Amigos','Empresa','Escola','Outro'];
const TIPOS_EV=['Treino','Jogo','Torneio','Convívio'];
const EST={nconf:'Não confirmado',conf:'Confirmado',just:'Ausência justificada',injust:'Ausência não justificada',pres:'Presente'};
const CAT_REC=['Quota','Pagamento por treino/jogo','Contribuição','Donativo','Patrocínio','Outra receita'];

let _img={};
function form(titulo,campos,valores,guardar,extra=''){
  _img={};
  const h=campos.map(c=>{
    const v=valores[c.k]??c.def??'';
    if(c.t==='chk')return `<label class="chk"><input type="checkbox" id="f-${c.k}" ${v?'checked':''}> ${c.l}</label>`;
    if(c.t==='multi')return `<label>${c.l}</label><div style="margin:-4px 0 10px">${c.o.map(([val,txt])=>`<label class="chk" style="margin:6px 0"><input type="checkbox" name="f-${c.k}" value="${val}" ${(v||[]).includes(val)?'checked':''}> ${txt}</label>`).join('')}</div>`;
    if(c.t==='sel')return `<label>${c.l}<select id="f-${c.k}">${c.o.map(o=>{const[val,txt]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${val==v?'selected':''}>${esc(txt)}</option>`}).join('')}</select></label>`;
    if(c.t==='area')return `<label>${c.l}<textarea id="f-${c.k}" rows="3">${esc(v)}</textarea></label>`;
    if(c.t==='img'){_img[c.k]=v||'';return `<label>${c.l}<input type="file" accept="image/*" id="f-${c.k}" onchange="lerImg('${c.k}',${c.max||400},'${c.mime||'image/jpeg'}')"><img class="imgprev" id="pv-${c.k}" src="${v||''}" style="${v?'':'display:none'}"></label>${v?`<button class="btn perigo mini" style="margin:-4px 0 10px" onclick="_img['${c.k}']='';el('pv-${c.k}').style.display='none'">Remover imagem</button>`:''}`}
    if(c.t==='row')return `<div class="g2">${c.c.map(cc=>`<label>${cc.l}<input id="f-${cc.k}" type="${cc.t||'text'}" value="${esc(valores[cc.k]??cc.def??'')}" ${cc.t==='number'?'min="0" step="any" inputmode="decimal"':''}></label>`).join('')}</div>`;
    return `<label>${c.l}<input id="f-${c.k}" type="${c.t||'text'}" value="${esc(v)}" ${c.t==='number'?'min="0" step="any" inputmode="decimal"':''} ${c.ph?`placeholder="${esc(c.ph)}"`:''}></label>`;
  }).join('');
  abrirModal(`<h3>${titulo}</h3>${h}${extra}<div class="acoes"><button class="btn cor" id="gravar">Guardar</button><button class="btn claro" onclick="fecharModal()">Cancelar</button></div>`);
  const todos=campos.flatMap(c=>c.t==='row'?c.c:[c]);
  el('gravar').onclick=()=>{
    const o={};
    for(const c of todos){
      if(c.t==='img'){o[c.k]=_img[c.k];continue}
      if(c.t==='multi'){o[c.k]=[...document.querySelectorAll(`[name="f-${c.k}"]:checked`)].map(x=>x.value);continue}
      const e=el('f-'+c.k);o[c.k]=c.t==='chk'?e.checked:c.t==='number'?(e.value===''?'':parseFloat(String(e.value).replace(',','.'))||0):e.value.trim();
      if(c.req&&(o[c.k]===''||o[c.k]===0&&c.t==='number')){toast('Preencha: '+c.l);e.focus();return}
    }
    if(guardar(o)!==false){gravar();fecharModal();tudo()}
  };
}

function decidirPedido(jid,ok){const eq=eqA();const i=eq.insc.find(x=>x.j===jid&&x.estado==='pendente');if(ok){i.estado='activo';i.f=['jog'];i.num=Math.max(0,...inscAct(eq).map(x=>x.num||0))+1}else eq.insc=eq.insc.filter(x=>x!==i);gravar();tudo();toast(ok?'Jogador aprovado':'Pedido recusado')}

let evAba='pres';
function abrirEvento(id){evAba='pres';abrirFolha(()=>fichaEvento(id))}
function fichaEvento(id){
  const e=D.eventos.find(x=>x.id===id);if(!e)return cabFolha('Actividade')+'<div class="vazio">Actividade removida.</div>';

  if(evAba==='pres')corpo=blocoPresencas(e,eq,p,passou);

  return `${cabFolha(e.tipo==='Jogo'?'Jogo vs '+esc(e.adv):esc(e.tipo))}
  <div class="card"><div class="meta">📅 ${dataLonga(e.data)} · ${esc(e.hora)}${e.fim?' às '+esc(e.fim):''}<br>📍 ${esc(e.local||'Campo por confirmar')}${e.custo?' · Campo: '+kz(e.custo):''}</div>
  ${e.notas?`<div style="margin-top:6px;font-size:14px">${esc(e.notas)}</div>`:''}
  <div style="margin-top:6px">${e.estado==='cancelado'?'<span class="tag mau">Cancelado</span>':passou?'<span class="tag ok">Realizado</span>':'<span class="tag cor">Agendado</span>'}</div>
  ${p.coord||p.trein?`<div class="acoes"><button class="btn claro mini" onclick="formEvento('${e.id}')">Editar</button><button class="btn wa mini" onclick="whatsapp(textoEvento('${e.id}'))">Avisar no WhatsApp</button>
   ${e.estado!=='cancelado'?`<button class="btn perigo mini" onclick="confirmar('Cancelar esta actividade?',()=>{const x=D.eventos.find(y=>y.id==='${e.id}');x.estado='cancelado';gravar();tudo();refrescarFolha()},'Cancelar actividade')">Cancelar</button>`:`<button class="btn claro mini" onclick="const x=D.eventos.find(y=>y.id==='${e.id}');x.estado='agendado';gravar();tudo();refrescarFolha()">Reactivar</button>`}
   <button class="btn perigo mini" onclick="confirmar('Apagar definitivamente esta actividade e o seu registo de presenças?',()=>{D.eventos=D.eventos.filter(y=>y.id!=='${e.id}');gravar();fecharFolha();tudo()},'Apagar')">🗑</button></div>`:''}</div>
  <div class="tabs">${abas.map(([k,t])=>`<button class="${k===evAba?'on':''}" onclick="evAba='${k}';refrescarFolha()">${t}</button>`).join('')}</div>
  ${corpo}`;

/* ---------- divisão de equipas ---------- */
let divN=2,divModo='equilibrado',divBase='conf';
function poolDiv(e,eq){const ids=inscAct(eq).map(i=>i.j);
  if(divBase==='conv'&&e.conv?.length)return e.conv.filter(j=>ids.includes(j));
  if(divBase==='conf'){const l=ids.filter(j=>['conf','pres'].includes(estadoP(e,j)));if(l.length)return l}
  return ids}
function gerarDivisao(evId){
  const e=D.eventos.find(x=>x.id===evId),eq=eqPor(e.eq);const pool=poolDiv(e,eq).map(jog);
  if(pool.length<divN*2){toast('Poucos jogadores para '+divN+' equipas');return}
  const G=Array.from({length:divN},()=>[]),nivel=g=>g.reduce((s,j)=>s+(j.nivel||3),0);
  if(divModo==='sorteio'){baralhar(pool).forEach((j,i)=>G[i%divN].push(j))}
  else if(divModo==='manual'){pool.forEach(j=>G[0].push(j))}
  else if(divModo==='nivel'){baralhar(pool).sort((a,b)=>(b.nivel||3)-(a.nivel||3)).forEach(j=>{const g=[...G].sort((a,b)=>a.length-b.length||nivel(a)-nivel(b))[0];g.push(j)})}
  else{ // equilibrado por posição e nível
    const ordem=['Guarda-redes','Fixo','Pivô','Ala','Universal'];
    ordem.forEach(pos=>{baralhar(pool.filter(j=>(j.posicao||'Universal')===pos)).sort((a,b)=>(b.nivel||3)-(a.nivel||3)).forEach(j=>{
      const g=[...G].sort((a,b)=>a.filter(x=>x.posicao===pos).length-b.filter(x=>x.posicao===pos).length||a.length-b.length||nivel(a)-nivel(b))[0];g.push(j)})});
  }
  e.grupos=G.map(g=>g.map(j=>j.id));e.divModo=divModo;gravar();refrescarFolha();rAgenda();toast(divModo==='manual'?'Mova os jogadores com os botões coloridos':'Equipas geradas');
}
function moverDiv(evId,jid,gi){const e=D.eventos.find(x=>x.id===evId);e.grupos=e.grupos.map(g=>g.filter(x=>x!==jid));e.grupos[gi].push(jid);gravar();refrescarFolha()}
function blocoDivisao(e,eq,p){
  const G=e.grupos||[];
  const ctrl=p.trein?`<div class="card"><div class="g2"><label>Nº de equipas<select onchange="divN=+this.value"><option ${divN==2?'selected':''}>2</option><option ${divN==3?'selected':''}>3</option><option ${divN==4?'selected':''}>4</option></select></label>
    <label>Jogadores<select onchange="divBase=this.value"><option value="conf" ${divBase==='conf'?'selected':''}>Confirmados</option><option value="conv" ${divBase==='conv'?'selected':''}>Convocados</option><option value="todos" ${divBase==='todos'?'selected':''}>Todos</option></select></label></div>
    <label>Critério<select onchange="divModo=this.value"><option value="equilibrado" ${divModo==='equilibrado'?'selected':''}>Equilíbrio por posição e nível</option><option value="nivel" ${divModo==='nivel'?'selected':''}>Equilíbrio por nível técnico</option><option value="sorteio" ${divModo==='sorteio'?'selected':''}>Sorteio</option><option value="manual" ${divModo==='manual'?'selected':''}>Distribuição manual</option></select></label>
    <button class="btn cor largo" onclick="gerarDivisao('${e.id}')">🔀 ${G.length?'Voltar a dividir':'Dividir equipas'}</button><div class="meta">Depois de dividir, pode trocar qualquer jogador com os botões coloridos.</div></div>`:'';
  if(!G.length)return ctrl+'<div class="vazio">As equipas ainda não foram divididas.</div>';
  const nv=g=>g.reduce((s,j)=>s+(jog(j).nivel||3),0);
  return ctrl+`<div class="grupos">${G.map((g,gi)=>`<div class="grupo" style="border-color:${CORES_GR[gi]}"><h5><span style="color:${CORES_GR[gi]}">Equipa ${NOMES_GR[gi]}</span><span class="meta">${g.length} jog. · nível ${nv(g)}</span></h5>
    ${g.map(jid=>{const j=jog(jid);return `<div class="jrow" style="margin-top:7px">${avatar(j,1)}<div class="info"><b style="font-size:14px">${esc(j.nome)}</b><span class="meta">${POS_C[j.posicao]||''} · ${'★'.repeat(j.nivel||3)}</span></div>
      ${p.trein?`<div class="mover">${G.map((_,k)=>k===gi?'':`<button style="background:${CORES_GR[k]}" onclick="moverDiv('${e.id}','${jid}',${k})">${NOMES_GR[k][0]}</button>`).join('')}</div>`:''}</div>`}).join('')}</div>`).join('')}</div>
  <div class="acoes"><button class="btn wa" onclick="whatsapp(textoDiv('${e.id}'))">Partilhar no WhatsApp</button><button class="btn claro" onclick="relatorio('convocatoria',{ev:'${e.id}'})">📄 PDF / imagem</button></div>`;
}
function textoDiv(ev){const e=D.eventos.find(x=>x.id===ev),eq=eqPor(e.eq);return `🔀 *EQUIPAS · ${eq.nome}*\n${e.tipo} de ${dataPt(e.data)}\n\n`+e.grupos.map((g,i)=>`*Equipa ${NOMES_GR[i]}*\n${g.map(j=>'• '+jog(j).nome+' ('+(POS_C[jog(j).posicao]||'')+')').join('\n')}`).join('\n\n')+`\n\nBom jogo a todos! ⚽`}

function guardarRes(id){const e=D.eventos.find(x=>x.id===id);const a=el('ra').value,b=el('rb').value;if(a===''||b===''){toast('Indique os dois resultados');return}

  if(!p.verFin){
    const dv=divida(eq,D.eu),cob=D.cobrancas.filter(c=>c.eq===eq.id&&c.j===D.eu).sort((a,b)=>b.data.localeCompare(a.data));

      const W=794,pageH=Math.floor(W*297/210),top=doc.getBoundingClientRect().top;
      const cortes=[...doc.querySelectorAll('tr,.dk,h2,.ass,.gr,.dcab,p')].map(n=>n.getBoundingClientRect().bottom-top).sort((a,b)=>a-b);
      const total=doc.offsetHeight;let ini=0,pg=0;
      while(ini<total-2){let lim=ini+pageH-20,fim=lim>=total?total:Math.max(...cortes.filter(c=>c>ini+200&&c<=lim),0)||lim;
        const sl=document.createElement('canvas');sl.width=cv.width;sl.height=Math.round((fim-ini)*esc_);
        const sx=sl.getContext('2d');sx.fillStyle='#fff';sx.fillRect(0,0,sl.width,sl.height);sx.drawImage(cv,0,Math.round(ini*esc_),cv.width,sl.height,0,0,cv.width,sl.height);
        if(pg)pdf.addPage();pdf.addImage(sl.toDataURL('image/jpeg',.82),'JPEG',0,0,210,(fim-ini)*210/W);
        pdf.setFontSize(8);pdf.setTextColor(150);pdf.text('Página '+(pg+1),200,292,{align:'right'});
        ini=fim;pg++;}
      salvarB64(base+'.pdf',pdf.output('datauristring').split(',')[1],'application/pdf');
    }
    box.innerHTML='';
  }catch(e){console.error(e);toast('Não foi possível gerar o ficheiro')}
  el('ldr').classList.remove('on');
}

/* =========================================================
   GESTÃO
   ========================================================= */
function rGestao(){
  const s=el('s-gestao'),p=P(),eq=eqA();
  const outras=D.eu!=='admin'?D.equipas.filter(e=>!e.insc.some(i=>i.j===D.eu)):[];
  const pedi=D.eu!=='admin'?D.equipas.filter(e=>e.insc.some(i=>i.j===D.eu&&i.estado==='pendente')):[];
  let tam=0;try{tam=(localStorage.getItem(CHAVE)||'').length}catch(e){}
  s.innerHTML=`<div class="titulo"><h2>Gestão</h2></div>
  ${eq?`<div class="card"><div class="jrow"><img class="av" src="${logoEq(eq)}" style="width:60px;height:60px"><div class="info"><b style="font-size:18px">${esc(eq.nome)}</b><span class="meta">${esc(eq.tipo)} · ${esc(eq.local||'')}<br>Quota: ${eq.quotaValor?kz(eq.quotaValor)+'/mês':'sem quota'} · Por treino/jogo: ${eq.valorEvento?kz(eq.valorEvento):'não cobra'}</span></div></div>
   ${p.coord?`<div class="acoes"><button class="btn cor" onclick="formEquipa('${eq.id}')">Editar identidade e regras</button>${p.admin?`<button class="btn perigo" onclick="apagarEquipa('${eq.id}')">Apagar equipa</button>`:''}</div>`:''}</div>`:''}
  ${p.coord&&eq?`<div class="card"><b>Funções na equipa</b><p class="meta" style="margin:4px 0 8px">Quem coordena, quem trata das finanças e quem treina. Toque num nome para alterar.</p>
   ${jogadoresEq(eq).filter(j=>j.insc.f.some(f=>f!=='jog')).map(j=>`<div class="jrow" style="margin-top:8px;cursor:pointer" onclick="formFuncoes('${j.id}')">${avatar(j,1)}<div class="info"><b>${esc(j.nome)}</b><span class="meta">${j.insc.f.filter(f=>f!=='jog').map(f=>FUNC[f]).join(', ')}</span></div><span>›</span></div>`).join('')||'<div class="meta">Ainda sem funções atribuídas.</div>'}
   <button class="btn claro mini" style="margin-top:10px" onclick="ir('jogadores')">Atribuir a outro jogador</button></div>`:''}
  ${p.coord&&eq?`<div class="card"><b>Avisos à equipa</b><p class="meta" style="margin:4px 0 8px">Ficam no painel de todos e podem seguir pelo WhatsApp.</p><button class="btn cor mini" onclick="formAviso()">+ Novo aviso</button>
   ${D.avisos.filter(a=>a.eq===eq.id).sort((a,b)=>b.data.localeCompare(a.data)).slice(0,5).map(a=>`<div style="margin-top:10px;border-top:1px solid var(--linha);padding-top:8px"><span class="meta">${dataPt(a.data)}</span><div>${esc(a.texto)}</div><div class="acoes" style="margin-top:4px"><button class="btn wa mini" onclick="whatsapp('📢 *${esc(eq.nome)}*\\n\\n'+D.avisos.find(x=>x.id==='${a.id}').texto)">WhatsApp</button><button class="btn perigo mini" onclick="D.avisos=D.avisos.filter(x=>x.id!=='${a.id}');gravar();tudo()">Apagar</button></div></div>`).join('')}</div>`:''}
  <div class="card"><b>Todas as equipas</b>${D.equipas.map(e=>`<div class="jrow" style="margin-top:10px"><img class="av p" src="${logoEq(e)}"><div class="info"><b>${esc(e.nome)}</b><span class="meta">${inscAct(e).length} jogadores · ${esc(e.tipo)}</span></div>
    ${minhasEquipas().includes(e)?`<button class="btn claro mini" onclick="D.eqAct='${e.id}';gravar();tudo()">${e.id===eq?.id?'Actual':'Abrir'}</button>`:pedi.includes(e)?'<span class="tag am">Pedido enviado</span>':`<button class="btn cor mini" onclick="pedirInscricao('${e.id}')">Pedir inscrição</button>`}</div>`).join('')||'<div class="vazio">Sem equipas.</div>'}
   ${p.admin?`<button class="btn cor largo" style="margin-top:12px" onclick="formEquipa()">+ Criar equipa</button>`:''}</div>
  <div class="card"><b>Cópia de segurança</b><p class="meta" style="margin:4px 0 8px">Os dados ficam neste telemóvel. Guarde uma cópia regularmente e envie-a para o e-mail ou o Drive. Também serve para passar tudo para outro telemóvel.</p>
   <div class="acoes"><button class="btn" onclick="salvarB64('futsal-em-equipa-copia-'+hoje()+'.json',b64utf8(JSON.stringify(D)),'application/json')">Guardar cópia</button><button class="btn claro" onclick="formRestaurar()">Restaurar cópia</button></div>
   <div class="meta" style="margin-top:8px">Espaço usado: ${(tam/1024).toFixed(0)} KB de cerca de 5000 KB.</div>
   ${p.admin?`<div class="acoes"><button class="btn perigo mini" onclick="confirmar('Carregar os dados de exemplo? Os dados actuais serão substituídos.',()=>{D=demo();gravar();tudo();toast('Dados de exemplo carregados')})">Carregar exemplo</button><button class="btn perigo mini" onclick="confirmar('Apagar todos os dados deste telemóvel?',()=>{try{localStorage.removeItem(CHAVE)}catch(e){};location.reload()},'Apagar tudo')">Apagar tudo</button></div>`:''}</div>
  <div class="card"><b>Regras de funcionamento</b><ul style="padding-left:18px;font-size:13.5px;margin-top:6px;color:var(--suave)">
   <li>Os jogadores entram por convite da coordenação ou pedem inscrição e aguardam aprovação.</li><li>O administrador e os coordenadores registam jogadores. Um jogador pode estar em várias equipas sem duplicar o cadastro.</li>
   <li>Cada equipa tem a sua tesouraria. O tesoureiro regista pagamentos em dinheiro e digitais (Multicaixa Express, transferência), com comprovativo opcional.</li><li>Depois de cada evento, o responsável confirma presenças e faltas.</li></ul></div>
  <p class="meta" style="text-align:center">Futsal em Equipa · versão 1.0</p>`;
}
function formEquipa(id){
  const e=D.equipas.find(x=>x.id===id)||{};
  form(id?'Identidade e regras':'Nova equipa',[{k:'nome',l:'Nome da equipa',req:1},{t:'row',c:[{k:'sigla',l:'Sigla (até 3 letras)'},{k:'cor',l:'Cor principal',t:'color',def:'#f97316'}]},
    {k:'logo',l:'Logótipo (opcional; sem logótipo usa-se um emblema com a sigla)',t:'img',max:320,mime:'image/png'},{k:'tipo',l:'Tipo de grupo',t:'sel',o:TIPOS_EQ},
    {k:'local',l:'Campo habitual'},{k:'diaHabitual',l:'Dia e hora habituais',ph:'Ex.: Sábado 16h00'},
    {t:'row',c:[{k:'quotaValor',l:'Quota mensal (Kz, 0 = sem quota)',t:'number',def:0},{k:'valorEvento',l:'Valor por treino/jogo (Kz)',t:'number',def:0}]}],e,o=>{
    o.quotaValor=+o.quotaValor||0;o.valorEvento=+o.valorEvento||0;o.quotaPeriodo=o.quotaValor?'mensal':'nenhuma';o.sigla=(o.sigla||'').toUpperCase().slice(0,3);
    if(id)Object.assign(e,o);else{const n={id:uid(),insc:[],criado:hoje(),...o};if(D.eu!=='admin')n.insc.push({j:D.eu,f:['coord','jog'],num:1,estado:'activo',desde:hoje()});D.equipas.push(n);D.eqAct=n.id}
    toast('Equipa guardada');
  });
}
function apagarEquipa(id){const e=eqPor(id);confirmar(`Apagar a equipa ${e.nome} com todos os eventos, movimentos e cobranças? Os jogadores continuam registados nas outras equipas.`,()=>{
  D.equipas=D.equipas.filter(x=>x.id!==id);D.eventos=D.eventos.filter(x=>x.eq!==id);D.movs=D.movs.filter(x=>x.eq!==id);D.cobrancas=D.cobrancas.filter(x=>x.eq!==id);D.avisos=D.avisos.filter(x=>x.eq!==id);
  D.eqAct=(D.equipas[0]||{}).id||'';gravar();tudo();toast('Equipa apagada')},'Apagar equipa')}
function pedirInscricao(id){const e=eqPor(id);e.insc.push({j:D.eu,f:['jog'],num:0,estado:'pendente',desde:hoje()});gravar();tudo();toast('Pedido enviado à coordenação da '+e.nome)}
function formAviso(){const eq=eqA();form('Novo aviso',[{k:'texto',l:'Mensagem',t:'area',req:1}],{},o=>{const a={id:uid(),eq:eq.id,data:hoje(),texto:o.texto};D.avisos.push(a);setTimeout(()=>confirmar('Enviar também para o grupo de WhatsApp?',()=>whatsapp('📢 *'+eq.nome+'*\n\n'+a.texto),'Enviar'),100)})}
function formRestaurar(){
  abrirModal(`<h3>Restaurar cópia</h3><p class="meta" style="margin-bottom:12px">Escolha o ficheiro .json guardado antes. Os dados deste telemóvel serão substituídos.</p><label>Ficheiro<input type="file" id="impf" accept=".json,application/json,text/plain,*/*"></label><div class="acoes"><button class="btn cor" id="impok">Restaurar</button><button class="btn claro" onclick="fecharModal()">Cancelar</button></div>`);
  let txt='';el('impf').onchange=ev=>{const f=ev.target.files[0];if(f)f.text().then(t=>{txt=t;toast('Ficheiro lido. Toque em Restaurar.')})};
  el('impok').onclick=()=>{try{const o=JSON.parse(txt);if(!o.equipas||!o.jogadores)throw 0;D=Object.assign(vazio(),o);gravar();fecharModal();tudo();toast('Dados restaurados')}catch(e){toast('Este ficheiro não é uma cópia válida')}};
}

  abrirModal(`<div style="text-align:center"><img src="icon-192.png" style="width:84px;border-radius:20px"><h3 style="margin:10px 0 2px;font-size:26px">FUTSAL EM EQUIPA</h3><p class="meta" style="margin-bottom:16px">Gestão de equipas, treinos, jogos e finanças desportivas.</p></div>
  <label>Nome da sua primeira equipa<input id="bv-eq" placeholder="Ex.: Família Castelo FC"></label>
  <label>Tipo de grupo<select id="bv-tipo">${TIPOS_EQ.map(t=>`<option>${t}</option>`).join('')}</select></label>
  <button class="btn cor largo" id="bv-novo">Criar a equipa e começar</button>
  <button class="btn claro largo" id="bv-demo">Ver primeiro com dados de exemplo</button>
  <button class="btn claro largo" onclick="formRestaurar()">Restaurar uma cópia de segurança</button>`,true);
  el('bv-novo').onclick=()=>{const n=el('bv-eq').value.trim();if(!n){toast('Escreva o nome da equipa');return}
    D=vazio();const e={id:uid(),nome:n,sigla:iniciais(n).slice(0,3),cor:'#f97316',logo:'',tipo:el('bv-tipo').value,local:'',diaHabitual:'',quotaValor:0,quotaPeriodo:'nenhuma',valorEvento:0,insc:[],criado:hoje()};
    D.equipas.push(e);D.eqAct=e.id;gravar();fecharModal();tudo();ir('gestao');setTimeout(()=>formEquipa(e.id),150);toast('Equipa criada. Complete a identidade e adicione o logótipo.')};
  el('bv-demo').onclick=()=>{D=demo();gravar();fecharModal();tudo();toast('Exemplo carregado. Toque em 👤 no topo para ver a app como jogador ou tesoureiro.')};

function render(k){({painel:rPainel,jogadores:rJogadores,agenda:rAgenda,jogos:rJogos,tesouraria:rTesouraria,relatorios:rRelatorios,gestao:rGestao})[k]()}
function tudo(){if(D.equipas.length&&!D.equipas.some(e=>e.id===D.eqAct))D.eqAct=D.equipas[0].id;rCab();render(aba);refrescarFolha()}
const h0=location.hash.slice(1);
rCab();ir(SECS.some(s=>s[0]===h0)?h0:'painel');

if('serviceWorker' in navigator&&!ANDROID&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
