<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ementa da Semana</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F5D50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="html2canvas.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#F5F0E6; --card:#FFFDF8; --ink:#1F2A24; --muted:#6B7269; --line:#E5DCCA;
  --green:#2F5D50; --green2:#4E8A73; --mint:#E3EFE8; --terra:#C2603A; --terra-l:#F6E2D6;
  --sun:#D9982E; --sun-l:#F8EBCF; --water:#2F76A3; --water-l:#DCEBF4; --red:#B4412F;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.4}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:22px;color:var(--green)}
.status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sun)}
.dot.ok{background:var(--green2)} .dot.err{background:var(--red)}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
main{padding:14px 14px 20px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip.today:not(.on){border-color:var(--green2);color:var(--green)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:12.5px}
.meal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.meal-h h3{font-size:17px}
.time-pill{font-size:12.5px;font-weight:600;background:var(--mint);color:var(--green);padding:4px 9px;border-radius:999px;border:0}
.time-pill input{border:0;background:transparent;font-weight:600;color:var(--green);width:88px}
.item{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.item:first-of-type{border-top:0}
.item .nm{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:10px;padding:3px 6px}
.qty input{width:52px;border:0;background:transparent;text-align:right;font-weight:600}
.qty span{font-size:12px;color:var(--muted)}
.x{width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:18px;line-height:1}
.x:active{background:var(--terra-l);color:var(--terra)}
.add-line{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.add-line select{flex:1 1 180px;min-width:0;padding:9px;border-radius:10px;border:1px solid var(--line);background:#fff}
.add-line input{width:80px;padding:9px;border-radius:10px;border:1px solid var(--line)}
.btn{padding:10px 14px;border-radius:12px;font-weight:600;background:var(--green);color:#fff}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green2)}
.btn.soft{background:var(--mint);color:var(--green)}
.btn.terra{background:var(--terra);color:#fff}
.btn.water{background:var(--water);color:#fff}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45}
.link{color:var(--green);font-weight:600;font-size:13.5px;padding:6px 0}
.sumline{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:2px 0 12px}
.sumline b{color:var(--ink)}
.water-card{background:linear-gradient(160deg,var(--water-l),#fff 70%)}
.ring{width:96px;height:96px;flex:0 0 auto}
.big{font-family:Fraunces,serif;font-size:28px;font-weight:700}
.qbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .tm input{width:78px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-weight:600;background:#fff}
.ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.ico.meal{background:var(--sun-l)} .ico.water{background:var(--water-l)} .ico.other{background:var(--terra-l)}
.mealdone{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.badge{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
.badge.ok{background:var(--mint);color:var(--green)}
.badge.late{background:var(--sun-l);color:#8a5a12}
.badge.vlate{background:var(--terra-l);color:var(--terra)}
.bar{height:9px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--green2)}
.nut{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:8px 0;border-top:1px solid var(--line)}
.nut:first-child{border-top:0}
.nut .bar{grid-column:1/-1}
.grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px;font-family:Fraunces,serif}
.stat span{font-size:11.5px;color:var(--muted)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--green);color:#fff}
.weekbars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.weekbars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.weekbars .col i{width:100%;max-width:34px;background:var(--green2);border-radius:6px 6px 2px 2px}
.weekbars .col.low i{background:var(--sun)}
.weekbars .col span{font-size:11px;color:var(--muted)}
.cat{font-family:Fraunces,serif;font-size:16px;margin:4px 0 6px;color:var(--green)}
.shop{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.shop:first-of-type{border-top:0}
.shop .ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--green2);display:grid;place-items:center;color:#fff;font-size:14px}
.shop.done .ck{background:var(--green2)}
.shop.done .sn{text-decoration:line-through;color:var(--muted)}
.shop .need{font-weight:700;text-align:right}
.shop .stock{grid-column:2/-1;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.shop .stock input{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:right}
.rp{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);gap:8px}
.rp:first-child{border-top:0}
.share-card{display:flex;gap:12px;align-items:center}
.share-card .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.share-card .tx{flex:1}
.share-card h3{font-size:16px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;min-width:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--green)}
.modal{position:fixed;inset:0;background:rgba(20,28,24,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--card);width:100%;max-width:720px;max-height:92vh;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.preview{flex:1;overflow:auto;background:var(--bg);border-radius:12px;padding:8px;min-height:200px}
.preview img{width:100%;display:block;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:60;max-width:90vw;text-align:center}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.field input,.field select,.field textarea{padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:15px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fgrid>*{min-width:0}.field input,.field select{width:100%}
details summary{cursor:pointer;font-weight:600;color:var(--green);list-style:none}
details summary::-webkit-details-marker{display:none}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.hint{background:var(--sun-l);border-radius:12px;padding:10px 12px;font-size:13px;color:#6d4a10;margin-bottom:12px}
.empty{text-align:center;color:var(--muted);padding:14px 0;font-size:13.5px}
/* export sheet */
#exportRoot{position:fixed;left:-10000px;top:0;width:794px}
.sheet{width:794px;background:#FFFDF8;color:#1F2A24;padding:40px 44px;font-family:Inter,sans-serif;font-size:13px}
.sheet h1{font-size:28px;color:#2F5D50;margin-bottom:2px}
.sheet .sh-sub{color:#6B7269;margin-bottom:20px;font-size:13px}
.sheet .sh-day{border:1px solid #E5DCCA;border-radius:12px;padding:12px 14px;margin-bottom:10px;break-inside:avoid}
.sheet .sh-day h2{font-size:17px;color:#2F5D50;margin-bottom:6px}
.sheet .sh-meal{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:4px 0;border-top:1px dashed #E5DCCA}
.sheet .sh-meal:first-of-type{border-top:0}
.sheet .sh-meal b{font-weight:600}
.sheet table{width:100%;border-collapse:collapse;margin-bottom:14px}
.sheet th{text-align:left;font-size:11.5px;color:#6B7269;font-weight:600;border-bottom:2px solid #E5DCCA;padding:6px 6px}
.sheet td{padding:6px;border-bottom:1px solid #EFE8DA;vertical-align:top}
.sheet .sh-cat{font-family:Fraunces,serif;font-size:17px;color:#2F5D50;margin:14px 0 4px}
.sheet .box{display:inline-block;width:13px;height:13px;border:1.5px solid #4E8A73;border-radius:3px;vertical-align:-2px;margin-right:6px}
.sheet .foot{margin-top:18px;font-size:11px;color:#6B7269}
.sheet .cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .pill{display:inline-block;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:600}

.person-btn{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-weight:600;font-size:13.5px;max-width:52vw}
.person-btn span.nmx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:0 0 auto;font-family:Inter}
.av.lg{width:40px;height:40px;font-size:16px}
.sub-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.chip .av{width:20px;height:20px;font-size:10.5px;display:inline-grid;margin-right:5px;vertical-align:-5px}
.tag{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--terra-l);color:var(--terra)}
.tag.home{background:var(--mint);color:var(--green)}
.meal-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ro-items{font-size:13.5px;color:var(--ink);line-height:1.55}
.pl-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pl-row:first-child{border-top:0}
.rec h3{font-size:16px;margin:14px 0 4px}
.rec ol{margin:6px 0 0;padding-left:20px}
.rec ol li{margin-bottom:6px;line-height:1.45}
.rec .ing{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px}
.rec .order{background:var(--mint);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--green)}
.rec .tip{font-size:12.5px;color:#6d4a10;background:var(--sun-l);border-radius:10px;padding:7px 10px;margin-top:6px}
.scroll{overflow:auto;flex:1}
.price{grid-column:2/-1;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.price input{width:80px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline}
.welcome{position:fixed;inset:0;background:var(--bg);z-index:70;overflow:auto;padding:calc(30px + env(safe-area-inset-top)) 20px 30px}
.welcome .inner{max-width:480px;margin:0 auto}
.loading{text-align:center;padding:60px 20px;color:var(--muted)}
.sheet .rec-blk{border:1px solid #E5DCCA;border-radius:12px;padding:10px 14px;margin-bottom:10px;break-inside:avoid}
.sheet .rec-blk h3{font-size:15px;color:#2F5D50;margin-bottom:4px}
.sheet ol{margin:4px 0 0;padding-left:18px}
.sheet ol li{margin-bottom:3px}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1 id="title">Ementa da Semana</h1>
    <button class="person-btn" data-act="people" id="personBtn"></button>
  </div>
  <div class="sub-row"><div class="sub" id="subtitle"></div><div class="status"><span class="dot" id="sdot"></span><span id="stext">A abrir…</span></div></div>
</header>
<main id="main"><div class="loading">A carregar…</div></main>
<nav class="tabs" id="tabs">
  <button data-tab="hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoje</button>
  <button data-tab="ementa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M4 10h16"/></svg>Ementa</button>
  <button data-tab="nutri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Nutrientes</button>
  <button data-tab="compras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1"/><circle cx="17" cy="20.5" r="1"/></svg>Compras</button>
  <button data-tab="corpo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="13" cy="4" r="2"/><path d="M8 21l3-6 3 3v3M7 11l3-3 4 1 3 3M11 15l1-6"/></svg>Corpo</button>

</nav>
<div id="exportRoot"></div>

function unitWord(F,q){return F.un==='lata'&&q>1?'latas':F.un}

function shortName(id){const F=FOODS[id];return F.buy||F.n.replace(/ \(.*\)$/,'').replace(/ (grelhad[oa]|grelhado inteiro|assado sem pele|salteados|refogada|cozidos variados)$/,'')}
function initials(n){return(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function avatar(M,cls=''){return `<span class="av ${cls}" style="background:${M.color||COLORS[0]}">${esc(initials(M.name))}</span>`}

/* ============ PESSOAS ============ */
const mem=id=>S.members.find(m=>m.id===id);
const active=()=>mem(S.active)||S.members[0];
function newMember(name,base){return{id:S.members.length?'m'+uid():MAIN,name,color:COLORS[S.members.length%COLORS.length],por:1,peso:70,altura:170,idade:35,sexo:'M',act:1.45,agua:2000,ov:{},...(base||{})}}
function scaleItems(items,f){if(f===1)return clone(items);return items.map(([id,g])=>{const F=FOODS[id];let q=g*f;if(F&&F.pu)q=Math.max(0.5,Math.round(q/F.pu*2)/2)*F.pu;else q=Math.max(5,Math.round(q/5)*5);return[id,q]})}
const isOv=(M,dk,m)=>!!(M.ov&&M.ov[dk]&&M.ov[dk][m]);
function memberItems(M,dk,m){return isOv(M,dk,m)?M.ov[dk][m]:scaleItems(S.plan[dk][m]||[],M.por||1)}
function eaters(dk,m){return S.members.filter(M=>!isOv(M,dk,m))}

/* ============ NUTRIÇÃO ============ */
const zero=()=>Object.fromEntries(NK.map(k=>[k,0]));
function sumItems(items){const t=zero();for(const[id,g]of items){const F=FOODS[id];if(!F)continue;NK.forEach((k,i)=>t[k]+=F.v[i]*g/100)}return t}
function addTot(a,b){NK.forEach(k=>a[k]+=b[k]);return a}
function memberDay(M,dk){const t=zero();for(const[m]of MEALS)addTot(t,sumItems(memberItems(M,dk,m)));return t}
function familyDay(dk){const t=zero();for(const[m]of MEALS)addTot(t,sumItems(S.plan[dk][m]||[]));return t}
function loggedTotals(M,date){const t=zero();const dk=dayKeyOf(parseYmd(date));for(const e of logsOf(M.id,date))if(e.type==='meal')addTot(t,sumItems(e.items||memberItems(M,dk,e.meal)));return t}
function targets(M){M=M||active();const bmr=10*M.peso+6.25*M.altura-5*M.idade+(M.sexo==='F'?-161:5);const kcal=Math.round(bmr*M.act/10)*10;const F=M.sexo==='F';
 return{kcal,prot:Math.round(M.peso*1.2),fib:F?25:30,vA:F?700:900,vC:F?75:90,vD:15,b12:2.4,ca:1000,fe:F&&M.idade<51?18:8,k:3500,mg:F?320:400,na:2000}}
const NUTR_INFO=[['fib','Fibra','g',0],['vA','Vitamina A','µg',0],['vC','Vitamina C','mg',0],['vD','Vitamina D','µg',1],['b12','Vitamina B12','µg',1],['ca','Cálcio','mg',0],['fe','Ferro','mg',1],['k','Potássio','mg',0],['mg','Magnésio','mg',0],['na','Sódio (limite)','mg',0]];

/* ============ COMPRAS E DESPENSA ============ */
const rawOf=(id,g)=>g*(FOODS[id].f||1);
function addNeed(id,g,need,ext,depth){const F=FOODS[id];if(!F)return;const x=REC[id]&&REC[id].x;if(x)for(const e in x)ext[e]=(ext[e]||0)+x[e]*g/100;
 if(F.dish){if((depth||0)<3)for(const[i2,r]of(F.ing||[]))addNeed(i2,g*r,need,ext,(depth||0)+1);return}
 need[id]=(need[id]||0)+rawOf(id,g)}
function needs(scope,days){const need={},ext={};const ms=scope==='all'?S.members:[mem(scope)].filter(Boolean);
 for(const M of ms)for(const[dk]of DAYS)for(const[m]of MEALS)for(const[id,g]of memberItems(M,dk,m))addNeed(id,g,need,ext)
 const k=days/7;for(const i in need)need[i]*=k;for(const i in ext)ext[i]*=k;return{need,ext}}
function buyLabel(id,raw,ceil){const F=FOODS[id];if(F.pu){const u=raw/F.pu;const q=ceil?Math.ceil(u-0.05):Math.round(u*10)/10;return fmtN(q,1)+' '+unitWord(F,q)}
 if(raw>=1000)return fmtN(raw/1000,raw>=10000?0:1)+(F.u==='ml'?' L':' kg');
 const r=raw<100?Math.ceil(raw/5)*5:Math.ceil(raw/10)*10;return fmtN(r)+' '+(F.u||'g')}
function extraLabel(e,q){const E=EXTRAS[e];if(E.pu){const n=Math.max(1,Math.ceil(q/E.pu-0.1));return n+' '+(n===1?{dentes:'dente',folhas:'folha'}[E.un]||E.un:E.un)}return(q>=1000?fmtN(q/1000,1)+' kg':fmtN(Math.max(1,Math.ceil(q)))+' g')}
const stockUnit=id=>{const F=FOODS[id];return F.pu?F.un:(F.u||'g')};
function weeklyRate(){return needs('all',7).need}
function estStock(id,rate){const s=S.pantry.stock[id];if(!s)return 0;const days=Math.max(0,Math.floor((parseYmd(todayYmd())-parseYmd(s.d))/864e5));return Math.max(0,s.q-(rate[id]||0)/7*days)}
function priceUnit(id){const F=FOODS[id];return F.pu?F.un:F.u==='ml'?'L':'kg'}
function costOf(id,raw){const p=+S.pantry.prices[id]||0;if(!p)return 0;const F=FOODS[id];return F.pu?Math.ceil(raw/F.pu-0.05)*p:raw/1000*p}
const money=v=>fmtN(Math.round(v))+' '+(S.pantry.cur||'Kz');

/* ============ REGISTOS ============ */
function logsOf(mid,date){return(S.logs[mid]&&S.logs[mid][date])||[]}
function logArr(mid,date){S.logs[mid]=S.logs[mid]||{};return S.logs[mid][date]||(S.logs[mid][date]=[])}
const logKey=(mid,date)=>'log-'+mid+'-'+date;
function parseLogKey(key){const m=key.slice(4).match(/^(?:([a-z0-9]+)-)?(\d{4}-\d{2}-\d{2})$/);return m?[m[1]||null,m[2]]:null}

/* ============ PERSISTÊNCIA ============ */
let DB=null,UID=null,MODE='local';const LSK='ementa-semana-v1:';const LEGACY=[];
function lsGet(k){try{return JSON.parse(localStorage.getItem(LSK+k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(LSK+k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(LSK+k)}catch(e){}}
function valOf(key){if(key==='plan')return{days:S.plan};if(key==='settings')return S.settings;if(key==='pantry')return S.pantry;if(key==='members')return{list:S.members,active:S.active};
 const p=parseLogKey(key);if(p)return{events:logsOf(p[0]||MAIN,p[1])};return{}}
function applyDoc(key,data){if(!data)return;
 if(key==='plan'&&data.days){for(const[dk]of DAYS)if(data.days[dk])S.plan[dk]=data.days[dk]}
 else if(key==='settings'){if(data.peso)OLD={peso:data.peso,altura:data.altura,idade:data.idade,sexo:data.sexo,act:data.act,agua:data.agua};S.settings={times:{...DEF_TIMES,...(data.times||{})}}}
 else if(key==='members'){S.members=data.list||[];S.active=data.active||(S.members[0]&&S.members[0].id)}
 else if(key==='pantry'){const p={stock:{},bought:{},prices:{},period:7,scope:'all',cur:'Kz',history:[],...data};for(const id in p.stock)if(typeof p.stock[id]==='number')p.stock[id]={q:p.stock[id],d:todayYmd()};delete p.people;S.pantry=p}
 else{const pk=parseLogKey(key);if(!pk)return;const mid=pk[0]||MAIN;S.logs[mid]=S.logs[mid]||{};
  if(!pk[0]){if(!LEGACY.includes(key))LEGACY.push(key);if(S.logs[mid][pk[1]]&&S.logs[mid][pk[1]].length)return}
  S.logs[mid][pk[1]]=data.events||[]}}
const timers={},chains={},dirty={};
function save(key){lsSet(key,valOf(key));if(key.startsWith('log-')){const idx=lsGet('logidx')||[];if(!idx.includes(key)){idx.push(key);lsSet('logidx',idx)}}
 if(MODE!=='cloud')return;dirty[key]=true;clearTimeout(timers[key]);timers[key]=setTimeout(()=>flush(key),700)}
function flush(key){const body=clone(valOf(key));chains[key]=(chains[key]||Promise.resolve()).then(()=>DB.collection('data/users/'+UID).doc(key).set(body)).then(()=>{dirty[key]=false;setStatus('ok')}).catch(e=>{dirty[key]=false;if(e&&e.code==='quota_exceeded')toast('Espaço de armazenamento cheio.');setStatus('err')})}
function migrateLegacy(){if(!LEGACY.length)return;const idx=(lsGet('logidx')||[]).filter(k=>!LEGACY.includes(k));lsSet('logidx',idx);
 for(const k of LEGACY.splice(0)){const d=parseLogKey(k)[1];save(logKey(MAIN,d));lsDel(k);if(MODE==='cloud')DB.collection('data/users/'+UID).doc(k).delete().catch(()=>{})}}
function setStatus(s){const d=$('#sdot'),t=$('#stext');d.className='dot'+(s==='ok'?' ok':s==='err'?' err':'');t.textContent=s==='ok'?'Guardado na conta':s==='err'?'Falha ao guardar':s==='local'?'Neste aparelho':'A ligar…'}
function loadLocal(){for(const k of['plan','settings','members','pantry']){const v=lsGet(k);if(v)applyDoc(k,v)}for(const k of(lsGet('logidx')||[])){const v=lsGet(k);if(v)applyDoc(k,v)}}
function onReady(){if(UI.ready)return;UI.ready=true;migrateLegacy();if(!S.members.length)showWelcome();render()}
async function initCloud(){
 if(!window.claude||typeof window.claude.use!=='function'){setStatus('local');onReady();return}
 const to=setTimeout(()=>{setStatus('local');onReady()},10000);
 try{
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user){clearTimeout(to);setStatus('local');onReady();return}
  const id=await user.id();if(!id){clearTimeout(to);setStatus('local');onReady();return}
  DB=db;UID=id;let first=true;
  DB.collection('data/users/'+UID).onSnapshot(snap=>{
   if(snap.metadata.fromCache&&first)return;
   if(first){first=false;clearTimeout(to);MODE='cloud';
    if(snap.empty){['plan','settings','members','pantry'].forEach(k=>save(k));for(const mid in S.logs)for(const d in S.logs[mid])save(logKey(mid,d))}
    else{snap.docs.forEach(d=>applyDoc(d.id,d.data()));['plan','settings','members','pantry'].forEach(k=>lsSet(k,valOf(k)))}
    setStatus('ok');if(S.members.length){const w=$('.welcome');if(w)w.remove()}if(UI.ready){migrateLegacy();if(!S.members.length&&!$('.welcome'))showWelcome();safeRender()}else onReady();return}
   let changed=false;
   snap.docChanges().forEach(ch=>{if(ch.type==='removed'||ch.doc.metadata.hasPendingWrites||dirty[ch.doc.id])return;applyDoc(ch.doc.id,ch.doc.data());lsSet(ch.doc.id,ch.doc.data());changed=true});
   if(changed)safeRender();
  },err=>{clearTimeout(to);MODE='local';setStatus('local');onReady()});
 }catch(e){clearTimeout(to);setStatus('local');onReady()}
}
let pendingRender=false;
function safeRender(){const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)){pendingRender=true;return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender){pendingRender=false;safeRender()}},50));

function memberForm(M,isNew){const P=M;return `<div class="fgrid">
 <label class="field" style="grid-column:1/-1">Nome<input id="fName" value="${esc(P.name||'')}" placeholder="ex.: Garcia" autocomplete="off"></label>
 <label class="field" style="grid-column:1/-1">Porção habitual<select id="fPor">${PORC.map(([v,n])=>`<option value="${v}" ${+P.por===v?'selected':''}>${n}</option>`).join('')}</select></label>

  if(view==='list'){h+=S.members.map(M=>`<div class="pl-row">${avatar(M,'lg')}<div style="flex:1;min-width:0"><div style="font-weight:600">${esc(M.name)} ${M.id===S.active?'<span class="badge ok">a usar</span>':''}</div><div class="small muted">${PORC.find(p=>p[0]===+M.por)?.[1]||'Adulto'} · ${fmtN(targets(M).kcal)} kcal/dia</div></div>

   h+=`<p class="note" style="margin:12px 0">"Usar" escolhe de quem são o registo do dia e os nutrientes que vê. Todas as pessoas entram na lista de compras.</p></div><button class="btn" data-p="new">+ Juntar pessoa</button>`}
  else{const M=view==='new'?newMember(''):mem(view);h+=memberForm(M);
   if(view!=='new'&&S.members.length>1&&M.id!==MAIN)h+=`<div style="margin-top:14px"><button class="link" style="color:var(--terra)" data-p="delask" data-id="${M.id}">Remover esta pessoa</button><span id="delc"></span></div>`;

 const root=$('#exportRoot');root.innerHTML=`<div class="sheet">${EXN[k][1]()}</div>`;
 const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="sheetbox"><div class="row between"><h2 style="font-size:19px">Pré-visualização</h2><button class="x" data-act="mclose" style="font-size:24px">×</button></div><div class="preview"><div class="empty">A preparar…</div></div>

 document.body.appendChild(modal);

 }catch(e){modal.querySelector('.preview').innerHTML='<div class="empty">Não foi possível gerar o documento.</div>'}}
let DL;async function getDownloads(){if(DL!==undefined)return DL;try{DL=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){DL=null}return DL}
const canvasBlob=c=>new Promise(r=>c.toBlob(r,'image/png'));
function blobB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}
async function saveFile(name,blob){
 if(window.AndroidBridge){try{const ext=name.split('.').pop();const mime={pdf:'application/pdf',png:'image/png',json:'application/json'}[ext]||'application/octet-stream';AndroidBridge.save(name,await blobB64(blob),mime)}catch(e){toast('Não foi possível guardar')}return}
 const dl=await getDownloads();
 if(dl){try{await dl.save({filename:name,data:blob});toast('Ficheiro pronto.');return}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('Aguarde um momento e tente de novo.');return}}}
 const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
 const n=document.getElementById('mnote');if(n)n.textContent='Se nada for transferido, mantenha o dedo pressionado na imagem para a guardar ou partilhar.'}
async function savePng(){if(CUR)saveFile(CUR.name+'.png',await canvasBlob(CUR.canvas))}
async function savePdf(){if(!CUR)return;const{jsPDF}=window.jspdf||{};if(!jsPDF){toast('A ferramenta de PDF ainda não carregou.');return}
 const pdf=new jsPDF({unit:'mm',format:'a4'});const W=210,H=297,c=CUR.canvas;const pageHpx=Math.floor(c.width*H/W);let y=0,first=true;
 while(y<c.height){const h=Math.min(pageHpx,c.height-y);const pc=document.createElement('canvas');pc.width=c.width;pc.height=h;const ctx=pc.getContext('2d');ctx.fillStyle='#FFFDF8';ctx.fillRect(0,0,pc.width,h);ctx.drawImage(c,0,y,c.width,h,0,0,c.width,h);
  if(!first)pdf.addPage();pdf.addImage(pc.toDataURL('image/jpeg',0.92),'JPEG',0,0,W,h*W/c.width);first=false;y+=h}
 saveFile(CUR.name+'.pdf',pdf.output('blob'))}

function openStorage(ids){const md=document.createElement('div');md.className='modal';md.innerHTML=`<div class="sheetbox"><div class="row between"><h2 style="font-size:19px">Onde guardar cada alimento</h2><button class="x" data-f="close" style="font-size:24px">×</button></div><div class="scroll rec">${storageHTML(ids,false)}</div></div>`;
 document.body.appendChild(md);md.addEventListener('click',e=>{if(e.target===md||e.target.closest('[data-f=close]'))md.remove()})}
function allIds(){const s=new Set();for(const M of S.members)for(const[dk]of DAYS)for(const[m]of MEALS)memberItems(M,dk,m).forEach(([id])=>s.add(id));if(!S.members.length)for(const[dk]of DAYS)for(const[m]of MEALS)(S.plan[dk][m]||[]).forEach(([id])=>s.add(id));return[...s].filter(id=>FOODS[id])}
function exStore(){return sheetHead('Onde guardar os alimentos','Para afixar na porta da geleira')+storageHTML(allIds(),true)+sheetFoot()}

function backupData(){return{app:'ementa-semana',v:3,date:new Date().toISOString(),plan:S.plan,settings:S.settings,members:S.members,active:S.active,pantry:S.pantry,logs:S.logs}}
async function doBackup(){const blob=new Blob([JSON.stringify(backupData())],{type:'application/json'});await saveFile('ementa-copia-'+todayYmd()+'.json',blob)}
function doRestore(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='ementa-semana')throw 0;
  if(d.plan)S.plan=d.plan;if(d.settings)S.settings={times:{...DEF_TIMES,...(d.settings.times||{})}};if(d.members)S.members=d.members;if(d.active)S.active=d.active;if(d.pantry)applyDoc('pantry',d.pantry);
  if(d.logs)for(const mid in d.logs){S.logs[mid]=S.logs[mid]||{};for(const dt in d.logs[mid]){S.logs[mid][dt]=d.logs[mid][dt];save(logKey(mid,dt))}}
  ['plan','settings','members','pantry'].forEach(k=>save(k));const w=$('.welcome');if(w)w.remove();UI.ready=true;render();toast('Dados recuperados')}catch(e){toast('Este ficheiro não é uma cópia válida')}};r.readAsText(file)}

Object.assign(REC,{
 funge_bombo:{t:15,ti:'Funge de bombó',s:['Ponha a ferver 1 litro de água por cada 2 chávenas de fuba (para 3 a 4 pessoas).','Quando ferver, tire o tacho do lume ou baixe para o mínimo e retire meio copo de água para um lado.','Vá deitando a fuba aos poucos, com uma mão, enquanto mexe com força com a colher de pau (o mexedor), sempre no mesmo sentido.','Continue a mexer e a "bater" encostando a massa às paredes do tacho, até ficar lisa, brilhante e elástica, sem grumos. Se ficar muito dura, junte um pouco da água que guardou.','Deixe 2 a 3 minutos em lume mínimo, tapado.','Para servir, molhe a colher em água e faça bolas.'],d:'O segredo está em mexer com força desde o início. Funge é só fuba e água: a energia vem dos hidratos, por isso combine sempre com peixe, galinha ou feijão e folhas.'},
 funge_milho:{t:25,ti:'Funge de milho',s:['Dissolva primeiro 3 colheres de fuba num copo de água fria (evita grumos).','Ponha 1 litro de água a ferver e junte essa mistura, mexendo.','Deixe cozinhar 5 minutos, mexendo de vez em quando.','Vá juntando o resto da fuba aos poucos, mexendo com força com a colher de pau.','Baixe o lume e deixe cozinhar 10 a 15 minutos, mexendo, até a massa se soltar das paredes.','Sirva em bolas, com a colher molhada.'],d:'O funge de milho tem mais proteína, ferro e magnésio do que o de bombó.'},
 papas_milho:{t:12,ti:'Papas de milho',s:['Dissolva a fuba de milho num pouco de água fria.','Aqueça o leite e, quando começar a ferver, junte a mistura, mexendo sempre.','Deixe 8 a 10 minutos em lume brando, mexendo, até engrossar.','Sirva morna, com banana às rodelas e canela. Evite juntar açúcar.']},
 muamba:{t:60,ti:'Muamba de galinha',x:{alho:3,cebola:10,louro:0.4,sal:0.4},s:['Corte a galinha em pedaços e retire a pele e a gordura visível. Tempere com alho esmagado, louro e pouco sal; deixe 20 minutos.','Num tacho largo, aqueça o óleo de palma (pouco: 1 colher de sopa por pessoa chega) com a cebola e o tomate picados, 5 minutos.','Junte a galinha e deixe ganhar cor, virando os pedaços, 10 minutos.','Acrescente água até quase cobrir e deixe cozinhar tapado 25 minutos.','Junte a abóbora em cubos e os quiabos às rodelas. Cozinhe mais 15 a 20 minutos, até a abóbora desfazer um pouco e o molho engrossar.','Prove e acerte o sal. Sirva com funge.'],d:'Sem jindungo no tacho: quem gostar de picante junta à parte, no prato. O óleo de palma dá cor e vitamina A, mas é gordura saturada, por isso use pouco.'},
 calulu:{t:60,ti:'Calulu de peixe',x:{alho:3,cebola:15,louro:0.4,sal:0.3},s:['Na véspera, ponha o peixe seco de molho em água, trocando a água 2 vezes, para tirar o sal.','Corte em pedaços o peixe fresco, o peixe seco, a cebola e o tomate em rodelas, os quiabos e a beringela.','Num tacho, faça camadas: cebola, tomate, peixe seco, peixe fresco, quiabos, beringela e gimboa (ou espinafres). Repita.','Regue com um fio de óleo de palma e meio copo de água. Junte o louro e o alho.','Tape e deixe cozinhar 35 a 40 minutos em lume brando, sem mexer, só abanando o tacho de vez em quando.','Sirva com funge, feijão de óleo de palma ou batata-doce.'],d:'O peixe seco já tem muito sal: não junte sal antes de provar.'},
 moamba_ginguba:{t:55,ti:'Moamba de ginguba',x:{alho:3,cebola:10,sal:0.4},s:['Tempere a galinha sem pele com alho e pouco sal.','Refogue a cebola e o tomate num fio de óleo, junte a galinha e deixe ganhar cor, 10 minutos.','Junte água até quase cobrir e deixe cozinhar 20 minutos.','Dissolva a pasta de jinguba (ou jinguba moída) num copo de água morna e junte ao tacho.','Cozinhe mais 15 a 20 minutos em lume brando, mexendo muitas vezes para não pegar ao fundo.','Sirva com funge ou arroz.']},
 feijao_oleo:{t:75,ti:'Feijão de óleo de palma',x:{cebola:12,alho:2,sal:0.4},s:['Coza o feijão (ou use feijão já cozido de frasco, passado por água).','Num tacho, aqueça um pouco de óleo de palma com a cebola picada, 5 minutos.','Junte o feijão cozido e um pouco da água da cozedura.','Deixe apurar 15 minutos em lume brando, mexendo e esmagando alguns grãos para engrossar.'],d:'Faça para 2 a 3 dias: guarda bem na geleira.'},
 kizaca:{t:90,ti:'Kizaca',x:{cebola:10,alho:2,sal:0.3},s:['Compre as folhas de mandioca já pisadas no mercado (ou pise-as no pilão).','Coza as folhas em bastante água durante pelo menos 1 hora, em lume médio. É importante cozer bem: as folhas cruas não são seguras.','Escorra parte da água. Junte a cebola picada, o alho e a jinguba moída.','Cozinhe mais 20 minutos, mexendo, e junte um fio de óleo de palma no fim.'],d:'Nunca encurte o tempo de cozedura das folhas de mandioca.'},
 gimboa:{t:10,ti:'Gimboa refogada',x:{alho:3,cebola:10},s:['Lave bem as folhas e corte grosseiramente.','Refogue alho e cebola num fio de azeite, 2 minutos.','Junte a gimboa e mexa 4 a 5 minutos, até murchar.'],d:'Em Portugal, se não encontrar gimboa, use espinafres ou couve.'},
 banana_pao:{t:25,ti:'Banana-pão cozida',x:{sal:0.2},s:['Corte as pontas e corte a banana-pão em 2 ou 3 pedaços, com casca.','Coza em água com uma pitada de sal 20 a 25 minutos.','Retire a casca e sirva.'],d:'Também pode assar no forno 25 minutos, a 200 °C.'},
 sardinha:{t:15,ti:'Sardinha grelhada',x:{sal:0.4},s:['Sardinhas inteiras: polvilhe com sal grosso 20 minutos antes.','Grelhe 4 a 5 minutos de cada lado no grelhador ou frigideira bem quente.','Coma também as espinhas pequenas: dão muito cálcio.'],d:'A sardinha e o carapau são os melhores substitutos do salmão: têm ómega-3 e vitamina D e são baratos.'},
 manga:{t:3,ti:'Manga',s:['Corte as duas "bochechas" de cada lado do caroço.','Faça quadrados na polpa sem cortar a casca e vire do avesso.']},
 abacaxi:{t:5,ti:'Abacaxi',s:['Corte a coroa e a base. De pé, retire a casca às tiras.','Corte em rodelas e retire o centro duro.']},
 goiaba:{t:1,ti:'Goiaba',s:['Lave bem e coma com casca e sementes.']},
 maracuja:{t:1,ti:'Maracujá',s:['Corte ao meio e coma a polpa com uma colher.']},
 sumo_mucua:{t:5,ti:'Sumo de múcua',s:['Por cada copo de água fria, junte 2 colheres de sopa de polpa de múcua.','Mexa bem ou bata 30 segundos e deixe repousar 5 minutos.','Coe e beba fresco, no próprio dia. Sem açúcar ou com muito pouco.'],d:'A múcua é muito rica em vitamina C e fibra.'},
 sumo_maracuja:{t:5,ti:'Sumo de maracujá',s:['Retire a polpa de 3 maracujás por cada litro de água.','Bata rapidamente (sem partir as sementes) e coe.','Sirva fresco, sem açúcar ou com muito pouco.']},
 agua_coco:{t:2,ti:'Água de coco',s:['Faça um furo no coco verde e beba fresca. Depois de aberta, guarde na geleira e beba no dia.'],d:'Óptima para repor líquidos depois do exercício ou para quebrar um jejum.'},
 cha_caxinde:{t:8,ti:'Chá de caxinde',s:['Por cada chávena, ferva água e junte 4 a 5 folhas de caxinde.','Deixe 5 minutos tapado, coe e beba quente ou frio, sem açúcar.'],d:'Sem cafeína: bom à noite e boa alternativa ao café.'},
 batido:{t:5,ti:'Batido de banana e papaia',s:['Junte no copo da varinha: 1 banana, uma fatia de papaia e um copo de leite.','Bata 1 minuto e beba logo.']},
 salada_frutas:{t:10,ti:'Salada de frutas tropicais',s:['Lave e descasque manga, papaia, abacaxi e banana.','Corte tudo em cubos pequenos e misture.','Sirva fresca, sem açúcar. Um pouco de sumo de maracujá por cima dá sabor.']},
 banana_assada:{t:15,ti:'Banana assada com canela',s:['Corte a banana ao meio ao comprido, com casca.','Leve ao forno a 200 °C, 12 a 15 minutos (ou frigideira tapada, 8 minutos).','Polvilhe com canela e sirva morna.']},
 papaia_iogurte:{t:5,ti:'Papaia com iogurte',s:['Corte a papaia em cubos e cubra com iogurte natural.','Pode juntar um pouco de aveia ou jinguba picada por cima.']},
 cocada:{t:30,ti:'Cocada amarela',s:['É um doce tradicional, rico em açúcar e gordura.','Reserve para festas ou um domingo de vez em quando, em porção pequena.']},

 escola:{n:'Trabalho e escola à noite',ic:'🎓',t:{pa:'06:30',lm:'10:00',al:'13:00',lt:'17:30',ja:'22:30'},lb:{lt:'Refeição antes da escola',ja:'Ceia leve'},w:{lm:'levar',al:'rest',lt:'levar',ja:'casa'}}
};
const WHERE={levar:'🎒 Levar de casa',rest:'🍽️ Restaurante',casa:'🏠 Em casa'};
const CAL_DAY={dom:1,seg:2,ter:3,qua:4,qui:5,sex:6,sab:7};
// refeições sugeridas para dias fora de casa (segunda a sexta, por ordem)
const RT_MEALS={
 lm:[[['banana',120],['jinguba',20]],[['maca',150],['amendoa',20]],[['manga',150],['nozes',20]],[['goiaba',100],['jinguba',20]],[['pera',170],['amendoa',20]]],
 al:[[['peixe',150],['arroz',160],['feijao',100],['salada',120],['azeite',5]],[['frango',150],['funge_bombo',230],['couve',100],['azeite',5]],[['tilapia',160],['batata_doce',220],['salada',120],['azeite',5]],[['muamba',250],['funge_bombo',200],['gimboa',80]],[['peixe',160],['arroz',160],['legumes',120],['azeite',5]]],
 lt_escola:[[['pao',70],['frango',90],['alface',20],['banana',120],['iogurte',125]],[['pao',70],['atum',80],['tomate',50],['maca',150],['jinguba',20]],[['pao',70],['ovo',110],['abacate',50],['manga',150],['iogurte',125]],[['arroz',150],['frango',110],['feijao_verde',80],['papaia',150]],[['batata_doce',200],['ovo',110],['papaia',150],['iogurte',125]]],
 ja_escola:[[['iogurte',125],['papaia',150]],[['sopa',300],['ovo',55]],[['leite',200],['aveia',25],['banana',60]],[['iogurte',125],['nozes',10],['cha_caxinde',250]],[['sopa',300],['pao',35]]],
 lt_trab:[[['iogurte',125],['banana',120]],[['maca',150],['jinguba',20]],[['iogurte',125],['papaia',150]],[['pao',35],['abacate',40]],[['batido',250]]]
};
const rtOf=(M,dk)=>(M&&M.rt&&M.rt[dk])||'casa';
function timeOf(M,dk,m){const r=rtOf(M,dk);if(r==='casa')return S.settings.times[m];const c=S.settings.rtT&&S.settings.rtT[r]&&S.settings.rtT[r][m];return c||ROUT[r].t[m]}
function mealLabel(M,dk,m){const R=ROUT[rtOf(M,dk)];return(R.lb&&R.lb[m])||mealName(m)}
function whereOf(M,dk,m){const R=ROUT[rtOf(M,dk)];return R.w&&R.w[m]||null}
function whereTag(M,dk,m){const w=whereOf(M,dk,m);return w?`<span class="tag ${w==='casa'?'home':''}" style="display:inline-block;margin:0 4px 6px 0;${w==='levar'?'background:var(--water-l);color:var(--water)':''}">${WHERE[w]}</span>`:''}
function applyRoutine(M,dks,r){M.rt=M.rt||{};M.ov=M.ov||{};M.rtOv=M.rtOv||{};
 for(const dk of dks){const i=Math.max(0,['seg','ter','qua','qui','sex','sab','dom'].indexOf(dk))%5;
  // limpa o que a rotina anterior tinha posto
  if(M.rtOv[dk]){for(const m of M.rtOv[dk])if(M.ov[dk])delete M.ov[dk][m];delete M.rtOv[dk]}
  if(M.ov[dk]&&!Object.keys(M.ov[dk]).length)delete M.ov[dk];
  if(r==='casa'){delete M.rt[dk];continue}
  M.rt[dk]=r;M.ov[dk]=M.ov[dk]||{};const set={lm:RT_MEALS.lm[i],al:RT_MEALS.al[i]};
  if(r==='escola'){set.lt=RT_MEALS.lt_escola[i];set.ja=RT_MEALS.ja_escola[i]}else set.lt=RT_MEALS.lt_trab[i];
  const por=M.por||1;for(const m in set)M.ov[dk][m]=scaleItems(set[m],por);M.rtOv[dk]=Object.keys(set)}}
function routineCard(M,dk){const r=rtOf(M,dk);const nm=esc(M.name.split(' ')[0]);
 return `<div class="card"><div class="small muted" style="margin-bottom:6px">Rotina de ${nm} à ${dayName(dk).toLowerCase()}</div>
 <div class="chips" style="padding-bottom:4px">${Object.entries(ROUT).map(([k,R])=>`<button class="chip ${r===k?'on':''}" data-act="rt-set" data-v="${k}">${R.ic} ${R.n}</button>`).join('')}</div>
 <button class="link" data-act="rt-week" data-v="${r}">Aplicar "${ROUT[r].n}" de segunda a sexta</button>
 ${r!=='casa'?`<p class="note" style="margin:4px 0 0">Os horários e as refeições de ${nm} neste dia foram adaptados: lanche para levar, almoço no restaurante${r==='escola'?', uma refeição a sério antes da escola e uma ceia leve ao chegar':''}. Pode mudar qualquer alimento.</p>`:''}</div>`}
const REST_GUIDE=`<h3>A regra do prato</h3><div class="ing">Metade do prato com <b>legumes ou salada</b>, um quarto com <b>peixe, frango ou feijão</b> e um quarto com <b>arroz, funge, batata-doce ou mandioca</b>. Só um destes, não dois.</div>
<h3>Boas escolhas num restaurante angolano</h3><div class="ing">• Peixe grelhado (carapau, garoupa, cacusso) ou frango grelhado<br>• Funge com muamba ou calulu, com pouco molho<br>• Feijão de óleo de palma em meia dose<br>• Kizaca, gimboa, couve ou salada<br>• Prato do dia cozido ou grelhado</div>
<h3>Peça assim</h3><div class="order">"Meia dose de arroz, por favor, e mais salada."<br>"Sem batata frita: troque por legumes ou batata-doce."<br>"O molho à parte."</div>
<h3>Evite no dia a dia</h3><div class="ing">• Fritos (peixe frito, batata frita, salgados)<br>• Dois hidratos juntos (arroz e batata frita, funge e arroz)<br>• Refrigerantes: peça água ou sumo natural sem açúcar<br>• Sobremesas doces: prefira fruta</div>
<div class="tip">💡 Em self-service ou bufê, encha primeiro metade do prato com legumes. Coma devagar: o corpo leva 20 minutos a sentir-se satisfeito.</div>`;
const NIGHT_GUIDE=`<h3>Porque aparece a vontade de doce à noite</h3><div class="ing">Normalmente é fome acumulada: muitas horas sem comer a sério entre o almoço e a noite, mais o cansaço do trabalho e da escola. O corpo pede energia rápida, e o doce é o mais fácil.</div>
<h3>O que resolve de verdade</h3><div class="order">1. Faça uma <b>refeição a sério entre as 17h e as 18h</b>, antes da escola (sandes de pão integral com frango, atum ou ovo, mais fruta e iogurte).<br>2. Leve <b>fruta e jinguba</b> para o intervalo das aulas.<br>3. Ao chegar a casa, uma <b>ceia leve</b> em vez de saltar o jantar.</div>
<h3>Se mesmo assim quiser algo doce</h3><div class="ing">• Papaia ou manga com iogurte natural<br>• Banana assada com canela<br>• Iogurte com um pouco de aveia e canela<br>• Leite morno com canela<br>• Chá de caxinde com uma tâmara ou 2 quadrados de fruta seca<br>• 3 a 4 nozes com meia banana</div>
<div class="tip">💡 Não guarde bolachas e doces à vista em casa: o que não está à mão não se come por impulso.</div>`;
function openInfo(title,html){const md=document.createElement('div');md.className='modal';md.innerHTML=`<div class="sheetbox"><div class="row between"><h2 style="font-size:19px">${title}</h2><button class="x" data-f="close" style="font-size:24px">×</button></div><div class="scroll rec">${html}</div></div>`;
 document.body.appendChild(md);md.addEventListener('click',e=>{if(e.target===md||e.target.closest('[data-f=close]'))md.remove()})}

/* ============ ACÇÕES ============ */
function findEv(id){for(const mid in S.logs)for(const d in S.logs[mid]){const e=S.logs[mid][d].find(x=>x.id===id);if(e)return[mid,d,e]}return[]}
function addMeal(m,time){const A=active(),dk=dayKeyOf(parseYmd(UI.date));logArr(A.id,UI.date).push({id:uid(),type:'meal',meal:m,time,items:clone(memberItems(A,dk,m))});save(logKey(A.id,UI.date));render()}
function listFor(scope,m){if(scope==='casa')return S.plan[UI.eDay][m]||(S.plan[UI.eDay][m]=[]);const M=mem(scope);return M.ov[UI.eDay][m]}
function saveScope(scope){save(scope==='casa'?'plan':'members')}
document.addEventListener('click',e=>{
 const tb=e.target.closest('#tabs button');if(tb){UI.tab=tb.dataset.tab;UI.addOpen=null;UI.confirmReset=false;render();window.scrollTo(0,0);try{history.replaceState(null,'','#'+UI.tab)}catch(_){}return}
 const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;
 const a=b.dataset.act,A=active();
 switch(a){
  case 'people':openPeople();break;
  case 'edit-me':openPeople(A.id);break;
  case 'who':S.active=b.dataset.v;save('members');render();break;
  case 'day-':case 'day+':{const d=parseYmd(UI.date);d.setDate(d.getDate()+(a==='day+'?1:-1));if(d>new Date())return;UI.date=ymd(d);render();break}
  case 'day0':UI.date=todayYmd();render();break;

  case 'water-c':showMini('Quantos ml bebeu?','number','250',v=>{const ml=parseInt(v);if(ml>0){logArr(A.id,UI.date).push({id:uid(),type:'water',ml,time:nowHM()});save(logKey(A.id,UI.date));render()}});break;
  case 'meal':addMeal(b.dataset.m,UI.date===todayYmd()?nowHM():timeOf(A,dayKeyOf(parseYmd(UI.date)),b.dataset.m));toast(mealName(b.dataset.m)+' registado');break;
  case 'meal-t':showMini('A que horas fez esta refeição?','time',timeOf(A,dayKeyOf(parseYmd(UI.date)),b.dataset.m),v=>{if(v)addMeal(b.dataset.m,v)});break;
  case 'undo':case 'del':{const[mid,d,ev]=findEv(b.dataset.id);if(!ev)return;S.logs[mid][d]=S.logs[mid][d].filter(x=>x.id!==ev.id);save(logKey(mid,d));render();break}
  case 'other-open':UI.otherOpen=true;render();break;
  case 'other-close':UI.otherOpen=false;render();break;
  case 'other-add':logArr(A.id,UI.date).push({id:uid(),type:'other',kind:$('#oKind').value,time:$('#oTime').value||nowHM(),note:$('#oNote').value.trim()});UI.otherOpen=false;save(logKey(A.id,UI.date));render();break;
  case 'guide':openGuide(b.dataset.dk,b.dataset.m,b.dataset.w);break;
  case 'eday':UI.eDay=b.dataset.d;UI.addOpen=null;UI.confirmReset=false;render();break;
  case 'ewho':UI.eWho=b.dataset.v;UI.addOpen=null;UI.confirmReset=false;render();break;
  case 'ov-on':{const M=mem(UI.eWho);M.ov=M.ov||{};M.ov[UI.eDay]=M.ov[UI.eDay]||{};M.ov[UI.eDay][b.dataset.m]=scaleItems(S.plan[UI.eDay][b.dataset.m]||[],M.por||1);save('members');render();toast('Agora pode mudar esta refeição só para '+M.name.split(' ')[0]);break}
  case 'ov-off':{const M=mem(UI.eWho);if(M.ov&&M.ov[UI.eDay]){delete M.ov[UI.eDay][b.dataset.m];if(!Object.keys(M.ov[UI.eDay]).length)delete M.ov[UI.eDay]}save('members');render();break}
  case 'idel':listFor(b.dataset.s,b.dataset.m).splice(+b.dataset.i,1);saveScope(b.dataset.s);render();break;
  case 'add-open':UI.addOpen=b.dataset.m;render();break;
  case 'add-close':UI.addOpen=null;render();break;
  case 'iadd':{const id=$('#addSel').value,F=FOODS[id];let q=parseFloat(String($('#addQty').value).replace(',','.'));if(!(q>0))q=F.pu?1:100;listFor(b.dataset.s,b.dataset.m).push([id,F.pu?q*F.pu:q]);UI.addOpen=null;saveScope(b.dataset.s);render();break}
  case 'reset':UI.confirmReset=true;render();break;
  case 'reset-no':UI.confirmReset=false;render();break;
  case 'reset-ok':S.plan=clone(DEF_PLAN);UI.confirmReset=false;save('plan');render();toast('Ementa da casa reposta');break;
  case 'reset-day':S.plan[UI.eDay]=clone(DEF_PLAN[UI.eDay]);UI.confirmReset=false;save('plan');render();toast(dayName(UI.eDay)+' reposta');break;
  case 'nmode':UI.nMode=b.dataset.v;render();break;
  case 'nday':UI.nDay=b.dataset.d;render();break;
  case 'period':S.pantry.period=+b.dataset.v;save('pantry');render();break;
  case 'scope':S.pantry.scope=b.dataset.v;save('pantry');render();break;
  case 'cur':S.pantry.cur=b.dataset.v;save('pantry');render();break;
  case 'pais':S.pantry.pais=b.dataset.v;if(b.dataset.v==='PT'&&S.pantry.cur==='Kz')S.pantry.cur='€';if(b.dataset.v==='AO'&&S.pantry.cur==='€')S.pantry.cur='Kz';save('pantry');render();break;
  case 'group':S.pantry.group=b.dataset.v;save('pantry');render();break;
  case 'catalog':openCatalog(b.dataset.m);break;
  case 'rt-quick':{const v=b.dataset.v;A.rtSeen=1;if(v!=='casa'){applyRoutine(A,['seg','ter','qua','qui','sex'],v);toast('Rotina adaptada de segunda a sexta')}save('members');render();break}
  case 'rt-set':{const M=mem(UI.eWho);if(!M)break;applyRoutine(M,[UI.eDay],b.dataset.v);M.rtSeen=1;save('members');render();break}
  case 'rt-week':{const M=mem(UI.eWho);if(!M)break;applyRoutine(M,['seg','ter','qua','qui','sex'],b.dataset.v);M.rtSeen=1;save('members');render();toast('Aplicado de segunda a sexta');break}
  case 'rest':openInfo('Comer bem no restaurante',REST_GUIDE);break;
  case 'night':openInfo('Fome e doce à noite',NIGHT_GUIDE);break;
  case 'go-corpo':UI.tab='corpo';render();window.scrollTo(0,0);break;
  case 'ao-plan':S.plan=clone(DEF_PLAN);S.settings.aoSeen=1;save('plan');save('settings');render();toast('Nova ementa aplicada');break;
  case 'ao-no':S.settings.aoSeen=1;save('settings');render();break;
  case 'fast-start':{const k=$('#fKind').value,K=FASTS.find(x=>x.k===k),t=$('#fStart').value||nowHM();const d=new Date();const[hh,mm]=t.split(':').map(Number);d.setHours(hh,mm,0,0);if(d>new Date())d.setDate(d.getDate()-1);A.fast={k,start:d.toISOString(),h:K.h,until:K.until,daniel:K.daniel};save('members');render();toast('Jejum iniciado');break}

  case 'alarm':if(setAlarm(b.dataset.h,b.dataset.m,b.dataset.l,b.dataset.once?'':(b.dataset.d||'1,2,3,4,5,6,7')))toast('Despertador criado: '+b.dataset.l);break;
  case 'alarm-meals':case 'alarm-water':{const L=a==='alarm-meals'?mealAlarms(A).map(x=>[x.t,x.l,x.d]):WATER_PLAN.map(([t,ml])=>[t,'Beber água ('+ml+' ml)',[1,2,3,4,5,6,7]]);L.forEach(([t,n,d],i)=>setTimeout(()=>setAlarm(+t.split(':')[0],+t.split(':')[1],n,d.join(',')),i*900));toast('A criar '+L.length+' despertadores…');break}
  case 'buy':if(S.pantry.bought[b.dataset.id])delete S.pantry.bought[b.dataset.id];else S.pantry.bought[b.dataset.id]=true;save('pantry');render();break;
  case 'restock':{const P=S.pantry,days=P.period||7,scope=P.scope==='all'||mem(P.scope)?P.scope:'all';const{need}=needs(scope,days),rate=weeklyRate();let n=0,total=0;
   for(const id in P.bought){const F=FOODS[id];if(!F||need[id]===undefined)continue;const st=estStock(id,rate);let tb=Math.max(0,need[id]-st);if(F.pu)tb=Math.ceil(tb/F.pu-0.05)*F.pu;total+=costOf(id,tb);P.stock[id]={q:st+tb,d:todayYmd()};n++}
   P.history=(P.history||[]).concat([{d:todayYmd(),label:PERIODS.find(p=>p[0]===days)[1],n,total,cur:P.cur||'Kz',scope:scope==='all'?'':mem(scope).name.split(' ')[0]}]).slice(-50);
   P.bought={};save('pantry');render();toast(n+' artigos juntos à despensa');break}
  case 'export':doExport(b.dataset.k);break;

 }
});
document.addEventListener('change',e=>{
 const t=e.target,a=t.dataset.act;
 if(a==='etime'){const[mid,d,ev]=findEv(t.dataset.id);if(ev&&t.value){ev.time=t.value;save(logKey(mid,d));render()}}
 else if(a==='enote'){const[mid,d,ev]=findEv(t.dataset.id);if(ev){ev.note=t.value.trim();save(logKey(mid,d))}}
 else if(a==='iqty'){const it=listFor(t.dataset.s,t.dataset.m)[+t.dataset.i];const f=FOODS[it[0]];const v=parseFloat(String(t.value).replace(',','.'));if(!(v>=0))return;it[1]=f.pu?v*f.pu:v;saveScope(t.dataset.s);render()}
 else if(a==='mtime'){if(t.value){const r=t.dataset.r||'casa';if(r==='casa')S.settings.times[t.dataset.m]=t.value;else{S.settings.rtT=S.settings.rtT||{};S.settings.rtT[r]=S.settings.rtT[r]||{};S.settings.rtT[r][t.dataset.m]=t.value}save('settings')}}
 else if(a==='stock'){let v=parseFloat(String(t.value).replace(',','.'));const F=FOODS[t.dataset.id];if(!(v>=0))v=0;S.pantry.stock[t.dataset.id]={q:F.pu?v*F.pu:v,d:todayYmd()};save('pantry');render()}
 else if(a==='restore'){if(t.files&&t.files[0])doRestore(t.files[0]);t.value=''}
 else if(a==='price'){const v=parseFloat(String(t.value).replace(',','.'));if(v>0)S.pantry.prices[t.dataset.id]=v;else delete S.pantry.prices[t.dataset.id];save('pantry');render()}
});
function showMini(q,type,def,cb){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheetbox" style="max-height:none"><h2 style="font-size:18px">${q}</h2><input type="${type}" value="${def}" ${type==='number'?'inputmode="numeric"':''} style="padding:12px;border:1px solid var(--line);border-radius:12px;font-size:18px;background:#fff"><div class="row" style="gap:8px"><button class="btn" style="flex:1" data-ok>Guardar</button><button class="btn ghost" style="flex:1" data-no>Cancelar</button></div></div>`;
 document.body.appendChild(m);const inp=m.querySelector('input');setTimeout(()=>inp.focus(),50);
 m.addEventListener('click',ev=>{if(ev.target.closest('[data-ok]')){cb(inp.value);m.remove()}else if(ev.target.closest('[data-no]')||ev.target===m)m.remove()})}
