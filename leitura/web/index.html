const sessOf=mid=>S.sessions.filter(s=>s.mid===mid);
function minutesOn(mid,date){return S.sessions.filter(s=>s.mid===mid&&s.date===date).reduce((a,s)=>a+(+s.min||0),0)}
function minutesRange(mid,from,to){return S.sessions.filter(s=>(!mid||s.mid===mid)&&s.date>=from&&s.date<=to).reduce((a,s)=>a+(+s.min||0),0)}
function pagesOf(s){const B=book(s.bookId);if(!B||s.to==null||s.from==null)return 0;const d=Math.max(0,s.to-s.from);return B.unit==='pct'?d/100*(B.total||250):d}
function streak(mid){const days=new Set(sessOf(mid).filter(s=>s.min>=5).map(s=>s.date));let d=new Date();if(!days.has(ymd(d)))d=addDays(d,-1);let n=0;while(days.has(ymd(d))){n++;d=addDays(d,-1)}return n}
function bestStreak(mid){const days=[...new Set(sessOf(mid).filter(s=>s.min>=5).map(s=>s.date))].sort();let best=0,cur=0,prev=null;for(const d of days){if(prev&&ymd(addDays(parseYmd(prev),1))===d)cur++;else cur=1;best=Math.max(best,cur);prev=d}return best}
function weekStart(d){d=new Date(d||new Date());const k=(d.getDay()+6)%7;return addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-k)}
function weekPct(M){const ws=weekStart();const done=minutesRange(M.id,ymd(ws),ymd(addDays(ws,6)));const days=Math.min(7,Math.round((new Date()-ws)/864e5)+1);return{done,goal:M.goalMin*7,soFar:M.goalMin*days,pct:done/(M.goalMin*7)}}
function stats(mid){const ss=sessOf(mid);const bs=S.books.filter(b=>b.mid===mid);
 return{sessions:ss.length,minutes:ss.reduce((a,s)=>a+(+s.min||0),0),pages:Math.round(ss.reduce((a,s)=>a+pagesOf(s),0)),done:bs.filter(b=>b.status==='lido').length,
  genres:new Set(bs.filter(b=>b.status!=='quero').map(b=>b.genre)).size,notes:S.notes.filter(n=>n.mid===mid).length,best:bestStreak(mid),longest:Math.max(0,...ss.map(s=>+s.min||0)),
  early:ss.some(s=>toMin(s.start)<420),late:ss.some(s=>toMin(s.start)>=1320)}}
function speed(mid,B){const ss=S.sessions.filter(s=>s.mid===mid&&s.to!=null&&s.from!=null&&s.min>0&&(!B||book(s.bookId)&&book(s.bookId).unit===B.unit));const p=ss.reduce((a,s)=>a+Math.max(0,s.to-s.from),0),m=ss.reduce((a,s)=>a+s.min,0);return m>=20&&p>0?p/m:null}
function finishEstimate(B){const M=mem(B.mid);if(!M||!B.total&&B.unit==='pag')return null;const total=B.unit==='pct'?100:B.total;const left=total-(B.pos||0);if(left<=0)return null;
 const sp=speed(B.mid,B)||(B.unit==='pct'?0.25:0.6);const from=ymd(addDays(new Date(),-13));const perDay=Math.max(M.goalMin*0.6,minutesRange(B.mid,from,today())/14);const days=Math.ceil(left/(sp*perDay));return{days,date:addDays(new Date(),days),perDay:Math.round(perDay)}}
function bookPct(B){if(B.unit==='pct')return(B.pos||0)/100;return B.total?(B.pos||0)/B.total:0}
function posLabel(B){return B.unit==='pct'?Math.round(B.pos||0)+'%':`p. ${B.pos||0}${B.total?' de '+B.total:''}`}

function insights(M){const out=[];const ss=sessOf(M.id);const st=streak(M.id);const wk=weekPct(M);
 if(!ss.length){out.push(['🌱','var(--teal-l)',`Comece hoje com só ${M.goalMin} minutos. O mais difícil é a primeira sessão; depois o hábito trata do resto.`]);return out}
 if(st>=2)out.push(['🔥','var(--amber-l)',`${st} dias seguidos a ler. ${st<7?'Faltam '+(7-st)+' para a medalha dos 7 dias.':'Continue: a de 30 dias está a '+(30-st)+' dias.'}`]);
 else{const last=ss.map(s=>s.date).sort().pop();if(last&&last<ymd(addDays(new Date(),-1)))out.push(['⏰','var(--rose-l)',`Não lê desde ${parseYmd(last).toLocaleDateString('pt-PT',{weekday:'long',day:'numeric'})}. Uma sessão de 10 minutos hoje recomeça a sequência.`])}
 const hrs={};ss.forEach(s=>{const h=Math.floor(toMin(s.start)/60);hrs[h]=(hrs[h]||0)+s.min});const bh=Object.entries(hrs).sort((a,b)=>b[1]-a[1])[0];
 if(bh&&ss.length>=4)out.push(['🕘','var(--sky-l)',`Lê melhor por volta das ${pad(bh[0])}h. Marque essa hora como o seu horário fixo de leitura.`]);
 const lw0=ymd(addDays(weekStart(),-7)),lw1=ymd(addDays(weekStart(),-1));const last=minutesRange(M.id,lw0,lw1);const sofar=wk.done;
 if(last>0){const r=sofar/last;out.push(r>=1?['📈','var(--teal-l)',`Esta semana já leu ${fmtDur(sofar)}, mais do que toda a semana passada (${fmtDur(last)}).`]:['📊','var(--sky-l)',`Leu ${fmtDur(last)} na semana passada; esta semana vai em ${fmtDur(sofar)}.`])}
 const cur=S.books.filter(b=>b.mid===M.id&&b.status==='lendo');for(const B of cur.slice(0,2)){const e=finishEstimate(B);if(e)out.push(['📅','var(--amber-l)',`Ao seu ritmo, termina "${esc(B.title)}" por volta de ${e.date.toLocaleDateString('pt-PT',{day:'numeric',month:'long'})} (${e.days} dias).`])}
 const recent=S.books.filter(b=>b.mid===M.id&&b.status!=='quero').slice(-4).map(b=>b.genre);if(recent.length>=3&&new Set(recent).size===1){const g=GENRES[recent[0]].n;out.push(['🧭','var(--rose-l)',`Os últimos livros são todos de ${g}. Que tal intercalar com um romance angolano ou uma biografia?`])}
 const y=ymd(addDays(new Date(),-1)),scr=screenMin(M.id,y),rd=minutesOn(M.id,y);if(scr!=null&&scr>60)out.push(['📵','var(--rose-l)',`Ontem: ${fmtDur(scr)} de ecrã e ${fmtDur(rd)} de leitura. Trocar só 10% do ecrã dava ${Math.round(scr*0.1)} minutos de leitura.`]);
 return out}
function questionOfDay(){const g=[...new Set(S.books.filter(b=>b.status==='lendo').map(b=>b.genre))];const pool=(g.length?g:Object.keys(GENRES)).flatMap(k=>GENRES[k].q);const d=new Date();return pool[(d.getDate()+d.getMonth()*31)%pool.length]}
function nextSlot(M){const now=new Date(),dw=now.getDay()+1;let best=null;for(const s of(M.slots||[]))for(let k=0;k<7;k++){const day=((dw-1+k)%7)+1;if(!s.d.includes(day))continue;const t=toMin(s.t);if(k===0&&t<=toMin(nowHM()))continue;const score=k*1440+t;if(!best||score<best.score)best={score,k,t:s.t,day};break}return best}

  const id=await user.id();if(!id){clearTimeout(to);onReady();return}DB=db;UIDU=id;let firstSnap=true;
  DB.collection('data/users/'+UIDU).onSnapshot(snap=>{if(snap.metadata.fromCache&&firstSnap)return;

function chProgress(ch){const T=CH_TPL[ch.tpl];const st=ch.start,end=ymd(addDays(parseYmd(st),T.days-1));const left=Math.max(0,Math.round((parseYmd(end)-parseYmd(today()))/864e5)+1);

  if(ch.tpl==='dias7'){const days=new Set(ss.filter(s=>s.min>=10).map(s=>s.date));let n=0;for(let i=0;i<7;i++){if(days.has(ymd(addDays(parseYmd(st),i))))n++}v=n;t=7}
  else if(ch.tpl==='livro_mes'){v=S.books.filter(b=>b.mid===M.id&&b.finished&&b.finished>=st&&b.finished<=end).length;t=1}
  else if(ch.tpl==='generos'){v=new Set(ss.map(s=>book(s.bookId)&&book(s.bookId).genre).filter(Boolean)).size;t=T.target}

 try{await document.fonts.ready}catch(e){}
 try{const canvas=await html2canvas(root.firstElementChild,{scale:2,backgroundColor:'#FFFDF9',logging:false});CUR={canvas,name:({report:'relatorio-clube',ficha:'ficha-de-leitura',cert:'certificado'})[k]+'-'+today(),land:k==='cert'};
  md.querySelector('.preview').innerHTML=`<img src="${canvas.toDataURL('image/png')}">`;md.querySelectorAll('[data-e=pdf],[data-e=png]').forEach(b=>b.disabled=false)}catch(e){md.querySelector('.preview').innerHTML='<div class="empty">Não foi possível gerar.</div>'}}
let DL;async function getDownloads(){if(DL!==undefined)return DL;try{DL=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){DL=null}return DL}
function blobB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)})}
async function saveFile(name,blob){if(window.AndroidBridge&&AndroidBridge.save){try{const ext=name.split('.').pop();AndroidBridge.save(name,await blobB64(blob),{pdf:'application/pdf',png:'image/png',json:'application/json'}[ext]||'application/octet-stream')}catch(e){toast('Não foi possível guardar')}return}
 const dl=await getDownloads();if(dl){try{await dl.save({filename:name,data:blob});toast('Ficheiro pronto');return}catch(e){if(e&&(e.code==='declined'||e.code==='rate_limited'))return}}
 const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function savePng(){if(CUR)saveFile(CUR.name+'.png',await new Promise(r=>CUR.canvas.toBlob(r,'image/png')))}
async function savePdf(){if(!CUR)return;const{jsPDF}=window.jspdf||{};if(!jsPDF){toast('A ferramenta de PDF ainda não carregou');return}const c=CUR.canvas;
 if(CUR.land){const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'landscape'});pdf.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,297,297*c.height/c.width);saveFile(CUR.name+'.pdf',pdf.output('blob'));return}
 const pdf=new jsPDF({unit:'mm',format:'a4'});const W=210,H=297,ph=Math.floor(c.width*H/W);let y=0,f=true;
 while(y<c.height){const h=Math.min(ph,c.height-y);const pc=document.createElement('canvas');pc.width=c.width;pc.height=h;const x=pc.getContext('2d');x.fillStyle='#FFFDF9';x.fillRect(0,0,pc.width,h);x.drawImage(c,0,y,c.width,h,0,0,c.width,h);if(!f)pdf.addPage();pdf.addImage(pc.toDataURL('image/jpeg',.92),'JPEG',0,0,W,h*W/c.width);f=false;y+=h}
 saveFile(CUR.name+'.pdf',pdf.output('blob'))}
function backup(){return{app:'clube-leitura',v:1,date:new Date().toISOString(),members:S.members,active:S.active,books:S.books,sessions:S.sessions,notes:S.notes,challenges:S.challenges,screen:S.screen,settings:S.settings}}
function mergeById(a,b){const m=new Map(a.map(x=>[x.id,x]));for(const x of b||[])m.set(x.id,Object.assign(m.get(x.id)||{},x));return[...m.values()]}
function readJSON(file,cb){const r=new FileReader();r.onload=()=>{try{cb(JSON.parse(r.result))}catch(e){toast('Ficheiro inválido')}};r.readAsText(file)}
function restore(d){if(d.app!=='clube-leitura'){toast('Este ficheiro não é do Clube de Leitura');return}
 if(d.kind==='sync'){S.members=mergeById(S.members,d.members);S.books=mergeById(S.books,d.books);S.sessions=mergeById(S.sessions,d.sessions);S.notes=mergeById(S.notes,d.notes);if(d.screen)for(const k in d.screen)S.screen[k]=Object.assign(S.screen[k]||{},d.screen[k]);if(!S.active)S.active=S.members[0].id;saveAll();render();toast('Progresso de '+(d.members[0]?d.members[0].name.split(' ')[0]:'família')+' juntado');return}
 Object.assign(S,{members:d.members||[],active:d.active,books:d.books||[],sessions:d.sessions||[],notes:d.notes||[],challenges:d.challenges||[],screen:d.screen||{},settings:d.settings||{}});saveAll();const w=$('.welcome');if(w)w.remove();UI.ready=true;render();toast('Dados recuperados')}
function syncOut(){const A=active();const scr={};const d=screenData();if(d){scr[A.id]={};d.forEach(x=>scr[A.id][x.date]=x.min)}else if(S.screen[A.id])scr[A.id]=S.screen[A.id];
 const data={app:'clube-leitura',kind:'sync',v:1,from:A.name,date:new Date().toISOString(),members:[A],books:S.books.filter(b=>b.mid===A.id),sessions:S.sessions.filter(s=>s.mid===A.id),notes:S.notes.filter(n=>n.mid===A.id),screen:scr};
 saveFile('progresso-'+(A.name.split(' ')[0]||'leitor').toLowerCase()+'-'+today()+'.json',new Blob([JSON.stringify(data)],{type:'application/json'}))}

/* ============ ACÇÕES ============ */
function setAlarm(h,m,l,days){if(window.AndroidBridge&&AndroidBridge.setAlarm){try{AndroidBridge.setAlarm(+h,+m,String(l),String(days||''));return true}catch(e){}}toast('Disponível na app Android');return false}
function openInfo(t,html){const md=document.createElement('div');md.className='modal';md.innerHTML=`<div class="sheetbox"><div class="row between"><h2 style="font-size:19px">${t}</h2><button class="x" data-f="close">×</button></div><div class="scroll rec">${html}</div></div>`;document.body.appendChild(md);md.addEventListener('click',e=>{if(e.target===md||e.target.closest('[data-f=close]'))md.remove()})}
document.addEventListener('click',e=>{
 const tb=e.target.closest('#tabs button');if(tb){UI.tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
 const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;const a=b.dataset.act,A=active();
 switch(a){
  case 'people':openPeople();break;
  case 'go':UI.tab=b.dataset.v;render();window.scrollTo(0,0);break;
  case 'start':startTimer(b.dataset.id);break;
  case 'stop':{const T=S.timers[A.id];if(!T)break;const min=Math.max(1,Math.round((Date.now()-T.start)/60000));const st=new Date(T.start);stopDialog(A.id,min,pad(st.getHours())+':'+pad(st.getMinutes()),ymd(st),T.bookId);break}
  case 'cancel-timer':delete S.timers[A.id];save('core');render();break;
  case 'log-manual':{const B=S.books.find(x=>x.mid===A.id&&x.status==='lendo');if(!B){toast('Junte primeiro um livro');break}stopDialog(A.id,20,nowHM(),today(),B.id);break}
  case 'book-new':openBookEdit(null);break;
  case 'book':openBook(b.dataset.id);break;
  case 'shelf-who':UI.shelfWho=b.dataset.v;render();break;
  case 'shelf-st':UI.shelfStatus=b.dataset.v;render();break;
  case 'ch-add':S.challenges.unshift({id:uid(),tpl:b.dataset.v,start:today()});save('core');render();toast('Desafio lançado à família!');break;
  case 'ch-del':S.challenges=S.challenges.filter(c=>c.id!==b.dataset.id);save('core');render();break;
  case 'prog-who':UI.progWho=b.dataset.v;render();break;
  case 'prog-range':UI.progRange=+b.dataset.v;render();break;
  case 'sess-del':{const s=S.sessions.find(x=>x.id===b.dataset.id);if(b.dataset.ok){S.sessions=S.sessions.filter(x=>x.id!==b.dataset.id);save('sessions');render()}else{b.dataset.ok=1;b.textContent='?';b.style.color='var(--rose)'}break}
  case 'usage-perm':try{AndroidBridge.openUsageSettings()}catch(e){}break;
  case 'sg':UI.sg=b.dataset.v;render();break;
  case 'sg-add':{const s=SUGG.find(x=>x[0]===b.dataset.t);openBookEdit(null,{title:s[0],author:s[1],genre:s[2],format:'fisico',status:'quero',mid:A.id,why:s[4]});break}
  case 'notebook':openInfo('Cadernos de anotações',NOTEBOOK);break;
  case 'slot-alarm':{const M=mem(b.dataset.mid),s=M.slots[+b.dataset.i];if(setAlarm(+s.t.split(':')[0],+s.t.split(':')[1],'Hora de ler, '+M.name.split(' ')[0],s.d.join(',')))toast('Alarme criado');break}
  case 'export':doExport(b.dataset.k);break;
  case 'sync-out':syncOut();break;
  case 'backup':saveFile('clube-leitura-copia-'+today()+'.json',new Blob([JSON.stringify(backup())],{type:'application/json'}));break;
 }});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.act;
 if(a==='restore'||a==='sync-in'){if(t.files&&t.files[0])readJSON(t.files[0],restore);t.value=''}
 else if(a==='scr-in'){const v=parseInt(t.value);S.screen[t.dataset.mid]=S.screen[t.dataset.mid]||{};if(v>=0)S.screen[t.dataset.mid][t.dataset.d]=v;else delete S.screen[t.dataset.mid][t.dataset.d];save('screen');render()}
 else if(a==='slot-t'){const M=mem(t.dataset.mid);if(t.value){M.slots[+t.dataset.i].t=t.value;save('core')}}});
setInterval(()=>{const el=$('#tmr');const A=UI.ready&&active();if(el&&A&&S.timers[A.id]){const m=Math.floor((Date.now()-S.timers[A.id].start)/60000);el.textContent=pad(Math.floor(m/60))+':'+pad(m%60)}},15000);
(function start(){loadLocal();if(S.members.length){UI.ready=true;S.members.forEach(M=>newBadges(M.id));render()}initCloud();if(!S.members.length)setTimeout(()=>{if(!UI.ready)onReady()},11000)})();
